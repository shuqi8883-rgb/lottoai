<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7f7f5"><title>企业库 · 校招雷达</title><style>body{margin:0;background:#f7f7f5;color:#171717;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}.wrap{max-width:900px;margin:auto;padding:22px 16px 60px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900}.logo span{color:#276ef1}.back{border:1px solid #e6e6e2;background:#fff;border-radius:12px;padding:9px 12px;text-decoration:none;color:#222}.hero{margin:35px 0 22px}.eyebrow{color:#276ef1;font-size:12px;font-weight:800}.hero h1{font-size:38px;letter-spacing:-1.5px;margin:7px 0}.hero p{color:#777;line-height:1.7}.search{background:#fff;border:1px solid #e5e5e1;border-radius:16px;padding:13px 15px;width:100%;box-sizing:border-box;outline:0;font-size:15px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:16px}.card{background:#fff;border:1px solid #e7e7e3;border-radius:18px;padding:17px}.name{font-size:17px;font-weight:900}.cat{font-size:11px;color:#276ef1;margin-top:5px}.meta{font-size:12px;color:#777;margin:9px 0 14px}.actions{display:flex;gap:8px}.btn{flex:1;text-align:center;text-decoration:none;border-radius:11px;padding:10px 8px;font-size:12px;font-weight:800;background:#111;color:#fff}.btn.alt{background:#f1f1ee;color:#333}@media(max-width:650px){.grid{grid-template-columns:1fr}.hero h1{font-size:31px}}</style><body><main class="wrap"><header class="top"><div class="logo">校招<span>雷达</span></div><a class="back" href="./">返回岗位</a></header><section class="hero"><div class="eyebrow">COMPANY DIRECTORY</div><h1>企业库</h1><p>把重点企业集中放在这里。支持按公司名、行业、地区搜索；“查看岗位”进入本站已同步岗位，“官网招聘”始终指向企业官方招聘页面。</p><input id="q" class="search" placeholder="搜索公司，例如：腾讯、AI、设计、Remote"></section><div id="grid" class="grid"></div></main><script>let data=[];async function init(){data=await fetch('./data/companies.json?'+Date.now()).then(r=>r.json());draw()}function draw(){let q=document.getElementById('q').value.trim().toLowerCase();let a=data.filter(c=>(c.name+' '+c.category+' '+c.regions).toLowerCase().includes(q));document.getElementById('grid').innerHTML=a.map(c=>`<article class="card"><div class="name">${c.name}</div><div class="cat">${c.category}</div><div class="meta">${c.regions}</div><div class="actions"><a class="btn" href="./?q=${encodeURIComponent(c.name)}">查看岗位</a><a class="btn alt" href="${c.official}" target="_blank" rel="noopener">官网招聘 ↗</a></div></article>`).join('')}document.getElementById('q').oninput=draw;init()</script></body></html>
