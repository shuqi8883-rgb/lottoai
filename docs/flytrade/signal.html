<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FruitFly 多资产买卖信号</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#08100b;color:#eef5ef;font:15px system-ui,-apple-system,sans-serif}main{max-width:980px;margin:auto;padding:20px 14px 50px}.hero,.card{background:#121b15;border:1px solid #28372c;border-radius:22px;padding:20px;margin-bottom:14px}.hero h1{margin:4px 0 7px;font-size:27px}.muted{color:#9baa9d}.status{font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.asset{background:#18231b;border:1px solid #2b3a2f;border-radius:18px;padding:17px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.name{font-weight:800}.ticker{color:#9baa9d;font-size:12px;margin-top:3px}.signal{font-size:42px;font-weight:950;margin:15px 0 5px}.buy{color:#6ee7a0}.sell{color:#ff8989}.hold{color:#f0d37a}.offline{color:#9aa49d}.metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px}.metric{background:#202a22;border-radius:12px;padding:10px}.metric span{display:block;color:#9eaaa1;font-size:11px}.metric b{display:block;margin-top:4px;font-size:16px}.gate{font-size:11px;margin-top:10px}.accepted{color:#75e6a1}.rejected{color:#ffb07e}.tag{display:inline-block;padding:6px 9px;border-radius:999px;background:#263229;color:#d9e7dc;font-size:11px}.warn{color:#e5d8bc;line-height:1.55;font-size:13px}.small{font-size:12px;color:#9eaaa1;line-height:1.5}@media(max-width:650px){.grid{grid-template-columns:1fr}.signal{font-size:38px}}
</style>
</head>
<body><main>
<section class="hero"><div class="muted">LottoAI · FruitFly V1 · 多资产研究台</div><h1>🪰 BTC + ETF 买卖信号</h1><div id="status" class="status muted">正在读取最新模型快照…</div></section>
<section id="assets" class="grid"><div class="card"><div class="muted">等待后台生成信号…</div></div></section>
<section class="card"><div class="tag">只读模式 · NO ORDERS</div><p class="warn">BUY / SELL / HOLD 是模型研究信号，不会自动下单。BTC 使用 OKX 公开行情；ETF 使用 Yahoo Finance 公共图表数据，ETF 数据可能存在延迟或处于非交易时段。</p><p class="small">后台约每 5 分钟生成一次快照，网页每 30 秒检查一次。信号不代表收益保证或投资建议。</p></section>
</main>
<script>
function esc(x){return String(x??'').replace(/[&<>\"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[m]))}
function card(a){const s=a.signal||'HOLD',cls=s.toLowerCase();const gate=a.risk_gate||{};return `<article class="asset"><div class="top"><div><div class="name">${esc(a.name)}</div><div class="ticker">${esc(a.id)} · ${esc(a.source)}</div></div><div class="tag">${esc(a.timeframe)}</div></div><div class="signal ${cls}">${esc(s)}</div><div class="metrics"><div class="metric"><span>价格</span><b>${Number(a.price).toLocaleString(undefined,{maximumFractionDigits:4})}</b></div><div class="metric"><span>强度</span><b>${(Number(a.strength)*100).toFixed(1)}%</b></div><div class="metric"><span>1根K线</span><b>${Number(a.return_1_candle_pct).toFixed(3)}%</b></div><div class="metric"><span>风险</span><b>${esc(a.risk)}</b></div></div><div class="gate ${gate.accepted?'accepted':'rejected'}">风险闸门：${gate.accepted?'ACCEPTED':'REJECTED'}${gate.reasons?.length?' · '+esc(gate.reasons.join(', ')):''}</div></article>`}
async function load(){try{const r=await fetch('./signal.json?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw new Error('signal.json 尚未生成');const d=await r.json();document.getElementById('status').textContent=`最新快照：${new Date(d.generated_at).toLocaleString()} · ${d.assets.length} 个资产`;document.getElementById('assets').innerHTML=d.assets.map(card).join('')||'<div class="card">暂无有效信号</div>';if(d.errors?.length)document.getElementById('status').textContent+=` · ${d.errors.length} 个资产数据暂不可用`;}catch(e){document.getElementById('status').textContent='后台信号快照暂不可用：'+e.message;document.getElementById('assets').innerHTML='<div class="card"><b>等待首次后台运行</b><p class="muted">GitHub Actions 需要先运行一次生成 signal.json。</p></div>'}}
load();setInterval(load,30000);
</script></body></html>
