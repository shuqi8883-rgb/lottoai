<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="60"><title>FruitFly Live Signal</title><style>body{margin:0;background:#0f1411;color:#eef4ef;font:16px system-ui,-apple-system,sans-serif}main{max-width:760px;margin:auto;padding:28px 18px}.card{background:#171e19;border:1px solid #29332c;border-radius:22px;padding:24px;margin-bottom:16px}.muted{color:#9eaaa1}.signal{font-size:56px;font-weight:800;letter-spacing:.04em;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.metric{background:#202921;border-radius:16px;padding:15px}.metric b{display:block;font-size:22px;margin-top:4px}.tag{display:inline-block;padding:7px 10px;border-radius:999px;background:#263229}.warn{margin-top:16px;padding:12px;border-radius:12px;background:#2a2520;color:#e8d8bd}@media(max-width:520px){.grid{grid-template-columns:1fr}.signal{font-size:44px}}</style></head><body><main><div class="card"><div class="muted">LottoAI · FruitFly V1 · OKX public market</div><h1>🪰 实盘行情信号台</h1><div id="signal" class="signal">LOADING</div><div id="meta" class="muted">读取最新信号…</div></div><div class="card"><div class="grid"><div class="metric">价格<b id="price">—</b></div><div class="metric">信号强度<b id="strength">—</b></div><div class="metric">1根K线变化<b id="ret">—</b></div><div class="metric">风险状态<b id="risk">—</b></div></div></div><div class="card"><div class="tag">只读模式 · NO_ORDERS</div><div class="warn">这是正式市场公开行情驱动的研究信号，不会自动下单，也不保证盈利。网页每分钟刷新一次；后台信号任务按约5分钟运行。</div></div></main><script>async function load(){try{const r=await fetch('./signal.json?t='+Date.now());const d=await r.json();document.getElementById('signal').textContent=d.signal||'HOLD';document.getElementById('meta').textContent=d.symbol+' · '+d.timeframe+' · 更新 '+new Date(d.updated_at).toLocaleString();document.getElementById('price').textContent=Number(d.price).toLocaleString();document.getElementById('strength').textContent=(Number(d.strength)*100).toFixed(1)+'%';document.getElementById('ret').textContent=Number(d.return_1_candle_pct).toFixed(3)+'%';document.getElementById('risk').textContent=d.risk||'NORMAL'}catch(e){document.getElementById('signal').textContent='OFFLINE';document.getElementById('meta').textContent='暂时无法读取信号'}}load();</script></body></html>
