const grammar=[['主谓一致','each/every/either/neither 等后通常接单数谓语；真正主语较长时先抓核心名词。','高频基础'],['定语从句','先找先行词，再判断关系词在从句中充当主语、宾语还是状语。','阅读+语法'],['非谓语动词','遇到两个动词先判断逻辑主语和时间关系，再选 to do、doing 或 done。','高频'],['虚拟语气','if、wish、would rather、as if 等结构要注意时间错位和动词形式。','高频'],['倒装','否定副词或 only 放句首时可能触发部分倒装，先寻找助动词或情态动词。','阅读'],['名词性从句','判断 what/that/whether 等引导的从句在主句中充当什么成分。','翻译+写作'],['比较结构','注意比较对象一致；the more..., the more... 是常见表达。','写作'],['连接词逻辑','however、therefore、moreover、although 等词决定句间逻辑。','阅读+写作'],['时态语态','先判断时间线，再判断主语与动作的主动/被动关系。','基础'],['长难句','先找谓语和主干，再处理从句、非谓语、插入语和后置定语。','阅读']];
const methods=[['艾宾浩斯间隔复习','新词当天→次日→第3天→第7天→第14天复习；每次先回忆再看答案。'],['主动回忆','遮住中文说英文、遮住英文说中文；回忆失败的词进入错词本。'],['词块学习','优先记固定搭配，如 be likely to、play a role in、as a result of。'],['真题驱动','做完一套后统计错因：词汇、定位、逻辑、语法、听力辨音。'],['听力精听','一遍做题→二遍看原文→三遍跟读→最后脱稿复述。'],['阅读定位','先看题干关键词，再回原文定位；生词不必全部查。'],['写作模板活用','准备开头、转折、因果、让步句型，但根据题目改写，避免机械套模板。'],['翻译分层','先保证主干正确，再补时间、地点、原因、定语；不会的复杂表达可换成简单准确表达。']];

let state=JSON.parse(localStorage.getItem('cet4state')||'{}');state.learned=state.learned||{};state.wrong=state.wrong||{};state.total=state.total||0;state.correct=state.correct||0;state.today=state.today||0;state.streak=state.streak||0;const save=()=>localStorage.setItem('cet4state',JSON.stringify(state));const speak=t=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}};const todayKey=new Date().toISOString().slice(0,10);if(state.lastDay!==todayKey){state.lastDay=todayKey;state.today=0;state.streak=(state.streak||0)+1;save()}

function renderWords(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级核心词库 · 先记高频，再扩展</h2><input class="search" id="search" placeholder="搜索英文或中文释义…"><div class="actions" style="margin-top:10px"><button class="btn" id="random">🎲 随机词</button><button class="btn" id="unlearned">只看未掌握</button><button class="btn" id="all">显示全部</button></div><div class="words" id="words"></div></div><div class="card"><h2>今日目标</h2><p class="notice">建议每天 30–50 个新词 + 复习旧词。点击词卡会标记为已学并播放发音。</p><div class="progress"><i id="prog"></i></div><p class="notice">本地已掌握 <b id="pc">0</b> / ${words.length}</p></div><div class="card"><h2>熟词生义提醒</h2><p class="notice">issue、approach、impact、shift、yield 等词在四级阅读中常出现不同词性或语境义，背词时一定要放回句子理解。</p></div></section>`;const box=document.querySelector('#words');function draw(q='',only=false){let arr=words.filter(x=>(!q||x[0].toLowerCase().includes(q.toLowerCase())||x[2].includes(q))&&(!only||!state.learned[x[0]])).slice(0,60);box.innerHTML=arr.map(x=>`<div class="word" data-w="${x[0]}"><b>${x[0]}</b><span>${x[1]}</span><em>${x[2]} ${state.wrong[x[0]]?' · 📕错词':''}</em></div>`).join('')||'<p class="notice">没有找到。</p>';box.querySelectorAll('.word').forEach(e=>e.onclick=()=>{let x=words.find(w=>w[0]===e.dataset.w);state.learned[x[0]]=1;state.today++;save();speak(x[0]);e.style.opacity=.55;stats();pc.textContent=Object.keys(state.learned).length;prog.style.width=Math.min(100,Object.keys(state.learned).length/words.length*100)+'%'})}draw();search.oninput=e=>draw(e.target.value);unlearned.onclick=()=>draw(search.value,true);all.onclick=()=>draw(search.value);random.onclick=()=>{words.sort(()=>Math.random()-.5);draw(search.value)};pc.textContent=Object.keys(state.learned).length;prog.style.width=Math.min(100,Object.keys(state.learned).length/words.length*100)+'%'}
let qi=0;function renderQuiz(){let x=words[qi%words.length];let opts=[x,...words.filter(w=>w[0]!==x[0]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);content.innerHTML=`<section class="grid"><div class="card"><h2>主动回忆 · 看中文说英文</h2><div class="quiz"><p>中文：<b>${x[2]}</b></p><p class="notice">音标：${x[1]}</p>${opts.map(o=>`<button class="option" data-v="${o[0]}">${o[0]}</button>`).join('')}<div class="feedback" id="fb"></div></div></div><div class="card"><h2>记忆闭环</h2><p class="notice">① 默想英文 → ② 选择答案 → ③ 朗读 → ④ 造句 → ⑤ 错了就进入错题本。</p><div class="actions"><button class="btn primary" id="say">🔊 朗读</button><button class="btn" id="next">下一词 →</button></div></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{if(document.querySelector('#fb').textContent)return;state.total++;let ok=b.dataset.v===x[0];if(ok){state.correct++;b.classList.add('ok')}else{b.classList.add('no');document.querySelector(`[data-v="${x[0]}"]`).classList.add('ok');state.wrong[x[0]]=(state.wrong[x[0]]||0)+1}document.querySelector('#fb').textContent=ok?'✓ 正确：'+x[0]+' · '+x[2]:'✗ 正确答案：'+x[0]+' · '+x[2];state.today++;save();stats();speak(x[0])});say.onclick=()=>speak(x[0]);next.onclick=()=>{qi++;renderQuiz()}}
let si=0;function renderSentences(){let x=sentences[si%sentences.length];content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级高频词句</h2><div class="sentence">${x[0]}</div><p class="cn">${x[1]}</p><div class="actions"><button class="btn primary" id="speak">🔊 听句子</button><button class="btn" id="show">隐藏/显示中文</button><button class="btn" id="nextS">下一句 →</button></div></div><div class="card"><h2>背句法</h2><p class="notice">先理解→分词块→朗读3遍→遮住英文→根据中文复述→第二天再回忆。</p></div></section>`;speak.onclick=()=>speak(x[0]);show.onclick=()=>document.querySelector('.cn').classList.toggle('hidden');nextS.onclick=()=>{si++;renderSentences()}}
function renderGrammar(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级高频语法地图</h2>${grammar.map(g=>`<div class="grammar-item"><b>${g[0]} <span class="tag">${g[2]}</span></b><span>${g[1]}</span></div>`).join('')}</div><div class="card"><h2>语法学习顺序</h2><p class="notice">词性 → 句子成分 → 时态语态 → 非谓语 → 从句 → 虚拟/倒装 → 长难句。</p></div><div class="card"><h2>长难句三步法</h2><p class="notice">1. 找谓语；2. 划从句和非谓语；3. 先读主干，再还原修饰信息。</p></div></section>`}
function renderExams(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>历年真题训练区</h2><p class="notice">本站不直接转载未经授权的整套商业试卷，改为提供年份训练入口、方法和公开开源资源。你可以在公开项目中查看可用材料。</p>${exams.map(e=>`<div class="exam"><b>${e[0]} · ${e[1]}</b><span>${e[2]}</span></div>`).join('')}</div><div class="card links"><h2>公开开源资源</h2><a href="https://github.com/MuckeGG/cet-exams" target="_blank">CET-4/CET-6 真题练习开源项目 ↗</a><a href="https://github.com/wamich/english-exem-md" target="_blank">英语四六级真题 Markdown 整理 ↗</a><a href="https://github.com/Liuxiangjian-ai/cet-skill" target="_blank">CET Skill：2015–2025 趋势与原创训练 ↗</a><a href="https://github.com/yurow/smart-english" target="_blank">Smart English：4500+ CET-4 词汇学习项目 ↗</a></div></section>`)}
function renderWrong(){let arr=Object.keys(state.wrong);content.innerHTML=`<section class="grid"><div class="card wide"><h2>📕 我的错题本</h2><p class="notice">这里保存你在单词测试中答错的词。复习时先遮住英文自己回忆，再点击朗读。</p>${arr.length?arr.map(k=>{let x=words.find(w=>w[0]===k);return `<div class="wrong"><b>${x?x[0]:k} <span class="tag">错 ${state.wrong[k]} 次</span></b><span>${x?x[2]:''} · ${x?x[1]:''}</span><div class="actions" style="margin-top:6px"><button class="btn" onclick="speak('${k.replace(/'/g,"\\'")}')">🔊 发音</button><button class="btn warn" onclick="deleteWrong('${k.replace(/'/g,"\\'")}')">移出错题本</button></div></div>`}).join(''):'<p class="notice">暂时没有错题。去“背单词”做几道题，这里会自动记录。</p>')}</div><div class="card"><h2>错题复习法</h2><p class="notice">错一次：当天复习；错两次：次日复习；反复错：放进高频复习组，并自己造句。</p><button class="btn" onclick="state.wrong={};save();renderWrong();stats()">清空错题本</button></div></section>`}function deleteWrong(k){delete state.wrong[k];save();renderWrong();stats()}
function renderMethods(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>热门备考方法 · 变成每天能执行的动作</h2>${methods.map((m,i)=>`<div class="method"><b>${i+1}. ${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div><div class="card wide"><h2>30天冲刺框架</h2><div class="plan"><div class="day"><b>第1周 · 打基础</b><span class="notice">核心词汇 + 基础语法 + 每天听力10–20分钟。</span></div><div class="day"><b>第2周 · 真题</b><span class="notice">阅读 + 听力精听 + 词句复习，开始计时。</span></div><div class="day"><b>第3周 · 套题</b><span class="notice">完整套题 + 错题归因 + 写作翻译训练。</span></div><div class="day"><b>第4周 · 冲刺</b><span class="notice">二刷错题 + 模拟考试 + 高频词复盘。</span></div></div></div><div class="card"><h2>⏱ 专注计时器</h2><div class="timer" id="clock">25:00</div><div class="actions"><button class="btn primary" id="start">开始</button><button class="btn" id="reset">重置</button></div></div><div class="card"><h2>每天建议</h2><p class="notice">30分钟词汇 + 30分钟听力 + 40分钟阅读 + 20分钟语法/翻译 + 20分钟作文。时间少时，优先保证词汇、听力和真题阅读连续性。</p></div></section>`;let sec=1500,timer=null;start.onclick=()=>{if(timer)return;timer=setInterval(()=>{sec--;clock.textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0){clearInterval(timer);timer=null;alert('本轮25分钟完成，休息5分钟再继续。')}},1000)};reset.onclick=()=>{clearInterval(timer);timer=null;sec=1500;clock.textContent='25:00'}}
function render(t){if(t==='words')renderWords();if(t==='quiz')renderQuiz();if(t==='sentences')renderSentences();if(t==='grammar')renderGrammar();if(t==='exams')renderExams();if(t==='wrong')renderWrong();if(t==='methods')renderMethods();stats()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)});render('words');
</script></body></html>
