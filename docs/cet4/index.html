<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1020"><title>CET-4 过级舱 · 英语四级学习站</title><style>
:root{--bg:#07111f;--panel:#0e1b2d;--panel2:#12243a;--line:#24415f;--text:#edf6ff;--muted:#91a7bd;--a:#63b7ff;--g:#53dfa0;--y:#ffd166;--r:#ff7180}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173b62,#07111f 42%,#040a12);color:var(--text);font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:18px 14px 55px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font-size:25px;font-weight:950}.brand b{color:var(--a)}.sub{color:var(--muted);font-size:11px;margin-top:4px}.back{color:#dff2ff;text-decoration:none;border:1px solid var(--line);padding:9px 12px;border-radius:12px;background:#0c2034}.hero{margin-top:16px;padding:22px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#102942,#0b1727)}h1{margin:0;font-size:28px}.hero p{color:#b5c8da;line-height:1.7}.tabs{display:flex;gap:8px;overflow:auto;margin:14px 0}.tab{white-space:nowrap;border:1px solid var(--line);background:#0b1a2b;color:#a9bfd3;border-radius:12px;padding:10px 14px;cursor:pointer;font-weight:800}.tab.active{background:#18537e;color:white;border-color:#4d9bd1}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:12px}.card{background:linear-gradient(145deg,#0e1e31,#091524);border:1px solid var(--line);border-radius:18px;padding:16px}.wide{grid-column:1/-1}.card h2{font-size:16px;margin:0 0 12px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat{background:#0b1b2d;border:1px solid #1c3751;border-radius:12px;padding:11px}.stat small{display:block;color:var(--muted);font-size:10px}.stat b{display:block;margin-top:4px;font-size:18px}.search{width:100%;padding:12px;border-radius:11px;border:1px solid #31506c;background:#081523;color:white;outline:none}.words{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px}.word{padding:13px;border:1px solid #1d3851;background:#0a192a;border-radius:13px;cursor:pointer}.word:hover{border-color:#4b9bd0}.word b{font-size:17px}.word span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.word em{color:#bcd0e2;font-style:normal;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #315c7c;background:#0c2740;color:#eaf6ff;border-radius:10px;padding:9px 12px;cursor:pointer}.btn.primary{background:#176b91}.quiz{font-size:19px;line-height:1.6}.option{display:block;width:100%;text-align:left;margin:8px 0;padding:12px;border:1px solid #25445e;border-radius:11px;background:#0a1a2b;color:#eaf5ff;cursor:pointer}.option.ok{border-color:var(--g);background:#0d3028}.option.no{border-color:var(--r);background:#321b23}.feedback{margin-top:10px;color:#a9c2d7;font-size:12px}.sentence{font-size:19px;line-height:1.7}.cn{color:#93acc2;font-size:13px}.grammar-item,.method,.exam{padding:12px 0;border-bottom:1px solid #193149}.grammar-item b,.method b,.exam b{display:block;margin-bottom:5px}.grammar-item span,.method span,.exam span{color:#9eb4c8;font-size:12px;line-height:1.7}.tag{display:inline-block;font-size:10px;background:#203d58;padding:4px 7px;border-radius:6px;color:#cfe9ff;margin-right:5px}.progress{height:7px;background:#10263b;border-radius:99px;overflow:hidden}.progress i{display:block;height:100%;background:var(--g);width:0}.notice{font-size:11px;line-height:1.7;color:#8199ae}.links a{display:block;color:#76c2ff;text-decoration:none;padding:9px 0;border-bottom:1px solid #193149}.hidden{display:none}@media(max-width:720px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.stats{grid-template-columns:1fr 1fr}.words{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><header class="top"><div><div class="brand">CET-4 <b>过级舱</b></div><div class="sub">词汇 · 词句 · 语法 · 真题训练 · 学习方法</div></div><a class="back" href="../">← LottoAI</a></header><section class="hero"><h1>大学英语四级智能学习站</h1><p>把“背单词、背词句、学语法、做真题、练听读写译”集中到一个页面。学习记录保存在本机浏览器，不需要注册。</p><div class="stats"><div class="stat"><small>词汇学习</small><b id="wordCount">—</b></div><div class="stat"><small>今日学习</small><b id="today">0</b></div><div class="stat"><small>答题正确率</small><b id="accuracy">0%</b></div><div class="stat"><small>连续学习</small><b id="streak">0 天</b></div></div></section><nav class="tabs"><button class="tab active" data-tab="words">📚 重点词汇</button><button class="tab" data-tab="quiz">⚡ 背单词</button><button class="tab" data-tab="sentences">🧠 背词句</button><button class="tab" data-tab="grammar">📝 语法</button><button class="tab" data-tab="exams">📄 历年真题</button><button class="tab" data-tab="methods">🚀 学习方法</button></nav><main id="content"></main></div><script>
const words=[
['abandon','əˈbændən','放弃；遗弃'],['absorb','əbˈzɔːrb','吸收；理解'],['accurate','ˈækjərət','准确的'],['adapt','əˈdæpt','适应；改编'],['adequate','ˈædəkwət','足够的；适当的'],['advocate','ˈædvəkeɪt','提倡；支持'],['approach','əˈproʊtʃ','接近；方法'],['appropriate','əˈproʊpriət','适当的'],['assume','əˈsuːm','假定；承担'],['beneficial','ˌbenɪˈfɪʃəl','有益的'],['capacity','kəˈpæsəti','能力；容量'],['circumstance','ˈsɜːrkəmstæns','情况；环境'],['contribute','kənˈtrɪbjuːt','贡献；促成'],['crucial','ˈkruːʃəl','关键的'],['decline','dɪˈklaɪn','下降；拒绝'],['demonstrate','ˈdemənstreɪt','证明；展示'],['distinguish','dɪˈstɪŋɡwɪʃ','区分；辨别'],['diverse','daɪˈvɜːrs','多样的'],['emerge','ɪˈmɜːrdʒ','出现；显露'],['enhance','ɪnˈhæns','提高；增强'],['essential','ɪˈsenʃəl','必要的；本质的'],['evaluate','ɪˈvæljueɪt','评价；评估'],['evidence','ˈevɪdəns','证据'],['frequent','ˈfriːkwənt','频繁的'],['fundamental','ˌfʌndəˈmentəl','基本的'],['generate','ˈdʒenəreɪt','产生；生成'],['impact','ˈɪmpækt','影响；作用'],['indicate','ˈɪndɪkeɪt','表明；暗示'],['inevitable','ɪnˈevɪtəbəl','不可避免的'],['interpret','ɪnˈtɜːrprət','解释；口译'],['maintain','meɪnˈteɪn','维持；坚持'],['obtain','əbˈteɪn','获得'],['potential','pəˈtenʃəl','潜在的；潜力'],['precise','prɪˈsaɪs','精确的'],['promote','prəˈmoʊt','促进；提升'],['relevant','ˈreləvənt','相关的'],['significant','sɪɡˈnɪfɪkənt','重要的；显著的'],['substitute','ˈsʌbstɪtuːt','替代；替代品'],['sufficient','səˈfɪʃənt','充足的'],['tend','tend','倾向于'],['transform','trænsˈfɔːrm','改变；转变'],['vary','ˈveri','变化；不同'],['accomplish','əˈkɑːmplɪʃ','完成'],['conventional','kənˈvenʃənəl','传统的'],['efficient','ɪˈfɪʃənt','高效的'],['expose','ɪkˈspoʊz','使接触；暴露'],['highlight','ˈhaɪlaɪt','突出；强调'],['justify','ˈdʒʌstɪfaɪ','证明合理'],['regulate','ˈreɡjəleɪt','管理；调节'],['restrict','rɪˈstrɪkt','限制']];
const sentences=[['It is essential that we develop the ability to think critically.','培养批判性思维能力至关重要。'],['There is no doubt that technology has changed the way we learn.','毫无疑问，科技改变了我们的学习方式。'],['What matters most is not how fast you learn, but how consistently you learn.','最重要的不是学得多快，而是能否持续学习。'],['As long as you keep practicing, you will make steady progress.','只要坚持练习，你就会稳步进步。'],['The more familiar you are with the topic, the easier it is to understand the passage.','你越熟悉主题，就越容易理解文章。'],['It is widely believed that reading can broaden our horizons.','人们普遍认为阅读能够开阔视野。']];
const grammar=[['主谓一致','主语是第三人称单数时，一般现在时谓语通常加 -s；each/every/either/neither 等后常接单数谓语。','高频基础'],['定语从句','先找先行词，再判断关系词在从句中充当什么成分。that/which/who 是常见选择。','阅读+语法'],['非谓语动词','看到两个动词时，先判断第二个动词与主语的逻辑关系，再决定 to do / doing / done。','高频'],['虚拟语气','if 条件句、wish、would rather、as if 等结构常考时间错位和动词形式。','高频'],['倒装','否定副词或 only 放句首时可能触发部分倒装；先找助动词/情态动词。','阅读'],['名词性从句','判断 what/that/whether 等引导的从句在主句中充当主语、宾语还是表语。','翻译+写作'],['比较结构','注意 than 前后的比较对象保持一致；the more..., the more... 是高频句型。','写作'],['连接词逻辑','however、therefore、moreover、although 等词决定句间逻辑，是阅读定位和写作提分关键。','阅读+写作']];
const methods=[['艾宾浩斯间隔复习','新词当天复习→次日→第3天→第7天→第14天。每次先回忆再看答案，不要只重复朗读。'],['主动回忆','把中文意思遮住，先自己说英文；把英文遮住，先说中文。回忆失败的词优先进入错词本。'],['词块学习','不要只背单词，优先记搭配：be likely to、play a role in、as a result of 等。'],['真题驱动','先做真题，再统计错因：词汇、定位、逻辑、语法、听力辨音，而不是只看总分。'],['听力精听','一遍做题→二遍看原文→三遍跟读→最后脱稿复述。把听不出的地方单独记录。'],['阅读定位','先读题干和选项关键词，再回原文定位；遇到生词不要每个都查，优先判断是否影响答案。'],['写作模板活用','准备开头、转折、因果、让步等句型，但每篇都根据题目改写，避免机械套模板。'],['翻译分层','先保证主干正确，再补时间、地点、原因、定语等信息；不会的复杂表达可换成简单准确表达。']];
const exams=[['2025','CET-4 真题资源','建议优先使用公开项目中的题目整理与练习页面；不要在本站直接转载未经授权的整套试卷。'],['2024','CET-4 真题资源','可用于按年份训练：听力、阅读、翻译、写作分别计时。'],['2023','CET-4 真题资源','建议完成后建立错题标签：词汇/语法/定位/逻辑/粗心。'],['2022','CET-4 真题资源','重点统计阅读正确率与听力正确率变化。'],['2021','CET-4 真题资源','完成整套后再做二刷，不要只背答案。'],['2020','CET-4 真题资源','适合作为历史题型训练材料。'],['2019','CET-4 真题资源','适合作为基础诊断和计时训练。'],['2015–2025','趋势训练','使用开源 CET Skill 的趋势分析思路，练习原创模拟题和题型分析。']];
let state=JSON.parse(localStorage.getItem('cet4state')||'{}');state.learned=state.learned||{};state.total=state.total||0;state.correct=state.correct||0;state.today=state.today||0;
const save=()=>localStorage.setItem('cet4state',JSON.stringify(state));
const speak=t=>{if('speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';speechSynthesis.speak(u)}};
function stats(){document.querySelector('#wordCount').textContent=words.length+'+ 高频词';document.querySelector('#today').textContent=state.today;document.querySelector('#accuracy').textContent=state.total?Math.round(state.correct/state.total*100)+'%':'0%';document.querySelector('#streak').textContent=(state.streak||0)+' 天'}
function renderWords(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级重点词汇 · 先记高频核心，再扩展词库</h2><input class="search" id="search" placeholder="搜索单词 / 中文释义…"><div class="actions" style="margin-top:10px"><button class="btn" id="random">🎲 随机20词</button><button class="btn" id="hideKnown">只看未掌握</button></div><div class="words" id="words"></div></div><div class="card"><h2>今日背词建议</h2><p class="notice">每天 30–50 个新词 + 复习旧词。看到单词后先自己回忆，再点击卡片听发音并核对释义。</p><div class="progress"><i id="prog"></i></div><p class="notice">本组已掌握 <b id="pc">0</b> / 50</p></div><div class="card"><h2>词汇策略</h2><p class="notice">优先掌握真题高频词、熟词生义、固定搭配和近义词辨析。词汇量不是唯一目标，能在语境中识别才是目标。</p></div></section>`;let box=document.querySelector('#words');function draw(q='',only=false){let arr=words.filter(x=>(!q||x[0].includes(q.toLowerCase())||x[2].includes(q))&&(!only||!state.learned[x[0]])).slice(0,50);box.innerHTML=arr.map(x=>`<div class="word" data-w="${x[0]}"><b>${x[0]}</b> <span>${x[1]}</span><em>${x[2]}</em></div>`).join('')||'<p class="notice">没有找到。</p>';box.querySelectorAll('.word').forEach(e=>e.onclick=()=>{let x=words.find(w=>w[0]===e.dataset.w);state.learned[x[0]]=1;state.today++;save();speak(x[0]);e.style.opacity=.55;stats();document.querySelector('#pc').textContent=Object.keys(state.learned).length});}draw();document.querySelector('#search').oninput=e=>draw(e.target.value);document.querySelector('#hideKnown').onclick=()=>draw(document.querySelector('#search').value,true);document.querySelector('#random').onclick=()=>{words.sort(()=>Math.random()-.5);draw()};document.querySelector('#pc').textContent=Math.min(50,Object.keys(state.learned).length);document.querySelector('#prog').style.width=Math.min(100,Object.keys(state.learned).length/50*100)+'%';}
let qi=0;function renderQuiz(){let x=words[qi%words.length];let opts=[x,...words.filter(w=>w!==x).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);content.innerHTML=`<section class="grid"><div class="card"><h2>主动回忆 · 看中文说英文</h2><div class="quiz"><p>中文：<b>${x[2]}</b></p><p class="notice">音标：${x[1]}</p>${opts.map(o=>`<button class="option" data-v="${o[0]}">${o[0]}</button>`).join('')}<div class="feedback" id="fb"></div></div></div><div class="card"><h2>记忆步骤</h2><p class="notice">① 先默想英文 → ② 选择答案 → ③ 朗读 → ④ 用这个词造一个自己的句子。</p><button class="btn primary" id="say">🔊 朗读答案</button><button class="btn" id="next">下一词 →</button></div></section>`;document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{state.total++;let ok=b.dataset.v===x[0];if(ok){state.correct++;b.classList.add('ok')}else{b.classList.add('no');document.querySelector(`[data-v="${x[0]}"]`).classList.add('ok')}document.querySelector('#fb').textContent=ok?'✓ 正确：'+x[0]+' · '+x[2]:'✗ 正确答案：'+x[0]+' · '+x[2];save();stats();speak(x[0])});document.querySelector('#say').onclick=()=>speak(x[0]);document.querySelector('#next').onclick=()=>{qi++;renderQuiz()}}
let si=0;function renderSentences(){let x=sentences[si%sentences.length];content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级高频词句</h2><div class="sentence">${x[0]}</div><p class="cn">${x[1]}</p><div class="actions"><button class="btn primary" id="speak">🔊 听句子</button><button class="btn" id="show">隐藏/显示中文</button><button class="btn" id="nextS">下一句 →</button></div></div><div class="card"><h2>背句子的方法</h2><p class="notice">先理解句意，再拆成词块朗读；最后遮住英文，根据中文复述。不要追求一次背下来。</p></div></section>`;document.querySelector('#speak').onclick=()=>speak(x[0]);document.querySelector('#show').onclick=()=>document.querySelector('.cn').classList.toggle('hidden');document.querySelector('#nextS').onclick=()=>{si++;renderSentences()}}
function renderGrammar(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>四级高频语法地图</h2>${grammar.map(g=>`<div class="grammar-item"><b>${g[0]} <span class="tag">${g[2]}</span></b><span>${g[1]}</span></div>`).join('')}</div><div class="card"><h2>语法学习顺序</h2><p class="notice">词性 → 句子成分 → 时态语态 → 非谓语 → 从句 → 虚拟/倒装 → 长难句分析。每学一个结构，马上去真题中找例子。</p></div><div class="card"><h2>长难句三步法</h2><p class="notice">1. 找谓语；2. 划出从句和非谓语；3. 删除修饰成分后先读主干，再还原细节。</p></div></section>`}
function renderExams(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>历年真题训练区</h2><p class="notice">这里提供年份导航、训练方法和公开开源资源入口。由于商业试卷通常存在版权限制，本页面不直接复制整套未经授权的试卷文本。</p>${exams.map(e=>`<div class="exam"><b>${e[0]} · ${e[1]}</b><span>${e[2]}</span></div>`).join('')}</div><div class="card links"><h2>公开开源资源</h2><a href="https://github.com/MuckeGG/cet-exams" target="_blank">CET-4/CET-6 真题练习开源项目（2019–2025）↗</a><a href="https://github.com/wamich/english-exem-md" target="_blank">英语四六级真题 Markdown 整理项目 ↗</a><a href="https://github.com/Liuxiangjian-ai/cet-skill" target="_blank">CET Skill：2015–2025 真题趋势与原创训练 ↗</a></div></section>`}
function renderMethods(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>热门备考方法 · 汇总成可执行方案</h2>${methods.map((m,i)=>`<div class="method"><b>${i+1}. ${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div><div class="card"><h2>30天冲刺框架</h2><p class="notice"><b>第1周：</b>核心词汇 + 基础语法 + 每天听力10–20分钟。<br><b>第2周：</b>真题阅读 + 听力精听 + 词句复习。<br><b>第3周：</b>完整套题计时 + 错题归因。<br><b>第4周：</b>二刷错题 + 作文翻译 + 模拟考试。</p></div><div class="card"><h2>每天建议</h2><p class="notice">30分钟词汇 + 30分钟听力 + 40分钟阅读 + 20分钟语法/翻译 + 20分钟作文。时间不足时优先保持词汇、听力和真题阅读的连续性。</p></div></section>`}
function render(t){if(t==='words')renderWords();if(t==='quiz')renderQuiz();if(t==='sentences')renderSentences();if(t==='grammar')renderGrammar();if(t==='exams')renderExams();if(t==='methods')renderMethods();stats()}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.tab)});render('words');
</script></body></html>
