<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CET-4过级舱"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>CET-4过级舱</title><style>:root{--bg:#f6f7f9;--card:#fff;--t:#111827;--m:#8b95a5;--line:#e8ebef;--blue:#1677ff;--green:#19a86b;--red:#ff453a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:88px}.head{position:sticky;top:0;z-index:5;padding:calc(16px + env(safe-area-inset-top)) 18px 12px;background:#f6f7f9ee;backdrop-filter:blur(18px)}.headrow{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:850}.logo i{color:var(--blue);font-style:normal}.sub{font-size:11px;color:var(--m);margin-top:3px}.install{border:0;border-radius:18px;padding:9px 13px;background:#111827;color:#fff;font-weight:700}.main{padding:8px 16px}.hero{background:#111827;color:#fff;border-radius:28px;padding:23px;margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:'30';position:absolute;right:5px;top:-38px;font-size:150px;font-weight:900;color:#ffffff09}.hero>*{position:relative;z-index:1}.eyebrow{font-size:11px;color:#9ca8b8;font-weight:700}.hero h1{font-size:28px;line-height:1.15;margin:8px 0}.hero p{font-size:13px;line-height:1.65;color:#adb8c7;margin:0;max-width:500px}.meter{display:flex;align-items:center;gap:13px;margin-top:20px}.ring{width:55px;height:55px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),#3b4552 0)}.ring span{width:41px;height:41px;border-radius:50%;display:grid;place-items:center;background:#111827;font-size:11px;font-weight:800}.meter b{font-size:18px}.meter small{display:block;color:#909baa;font-size:11px;margin-top:2px}.title{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}.title h2{font-size:18px;margin:0}.title span{font-size:11px;color:var(--m)}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:15px;margin-bottom:12px;box-shadow:0 7px 26px #1720330a}.task{display:flex;align-items:center;gap:12px;padding:14px 2px;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.check{appearance:none;width:25px;height:25px;border:1.5px solid #d5dae1;border-radius:50%;flex:none}.check:checked{background:var(--green);border-color:var(--green);position:relative}.check:checked:after{content:'✓';color:white;position:absolute;font-weight:900;left:5px;top:1px}.tt{font-size:14px;font-weight:750}.ts{font-size:11px;color:var(--m);margin-top:4px}.time{margin-left:auto;background:#f1f3f6;border-radius:8px;padding:5px 7px;font-size:9px;color:var(--m);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.mini small{color:var(--m)}.mini b{display:block;font-size:21px;margin-top:4px}.wordbox{text-align:center;padding:28px 16px}.word{font-size:39px;font-weight:850}.phon{font-size:13px;color:var(--m);margin:6px}.mean{font-size:18px;margin:15px}.btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 16px;background:#eef1f5;font-weight:750;color:#17202b}.primary{background:var(--blue);color:#fff}.choice{width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left;font-size:15px;margin:5px 0}.ok{background:#eaf9f1!important;border-color:var(--green)!important}.no{background:#fff0ef!important;border-color:var(--red)!important}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:0;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--m);margin-top:3px}.sound{border:0;border-radius:50%;width:36px;height:36px;background:#edf4ff;color:var(--blue)}.note{color:var(--m);font-size:12px;line-height:1.7}.bottom{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav{border:0;background:none;color:#9aa3ae;font-size:10px;font-weight:700}.nav b{display:block;font-size:20px;margin-bottom:2px}.nav.active{color:var(--blue)}.toast{position:fixed;z-index:20;left:50%;bottom:105px;transform:translate(-50%,10px);background:#111827;color:#fff;padding:10px 15px;border-radius:20px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{font-size:14px}.item p{font-size:12px;color:#697386;line-height:1.65;margin:5px 0 0}@media(min-width:721px){body{padding-top:10px}}</style></head><body><div class="app"><header class="head"><div class="headrow"><div><div class="logo">CET-4 <i>过级舱</i></div><div class="sub">30天冲刺 · 每天打开，照着做</div></div><button class="install" id="install">＋ 安装</button></div></header><main class="main" id="main"></main><nav class="bottom"><button class="nav active" data-p="home"><b>⌂</b>今日</button><button class="nav" data-p="words"><b>Aa</b>词汇</button><button class="nav" data-p="quiz"><b>✓</b>练习</button><button class="nav" data-p="wrong"><b>♡</b>错题</button><button class="nav" data-p="more"><b>•••</b>更多</button></nav></div><div class="toast" id="toast"></div><script>
const words=[['abandon','əˈbændən','放弃'],['absorb','əbˈzɔːrb','吸收；理解'],['accurate','ˈækjərət','准确的'],['adapt','əˈdæpt','适应'],['adequate','ˈædəkwət','足够的'],['advocate','ˈædvəkeɪt','提倡'],['approach','əˈproʊtʃ','方法；接近'],['assume','əˈsuːm','假定'],['beneficial','ˌbenɪˈfɪʃəl','有益的'],['capacity','kəˈpæsəti','能力'],['circumstance','ˈsɜːrkəmstæns','情况'],['contribute','kənˈtrɪbjuːt','贡献；促成'],['crucial','ˈkruːʃəl','关键的'],['decline','dɪˈklaɪn','下降；拒绝'],['demonstrate','ˈdemənstreɪt','证明；展示'],['distinguish','dɪˈstɪŋɡwɪʃ','区分'],['diverse','daɪˈvɜːrs','多样的'],['emerge','ɪˈmɜːrdʒ','出现'],['enhance','ɪnˈhæns','提高；增强'],['essential','ɪˈsenʃəl','必要的'],['evaluate','ɪˈvæljueɪt','评估'],['evidence','ˈevɪdəns','证据'],['frequent','ˈfriːkwənt','频繁的'],['fundamental','ˌfʌndəˈmentəl','基本的'],['generate','ˈdʒenəreɪt','产生'],['impact','ˈɪmpækt','影响'],['indicate','ˈɪndɪkeɪt','表明'],['inevitable','ɪnˈevɪtəbəl','不可避免的'],['interpret','ɪnˈtɜːrprət','解释'],['maintain','meɪnˈteɪn','维持；坚持'],['obtain','əbˈteɪn','获得'],['potential','pəˈtenʃəl','潜力；潜在的'],['precise','prɪˈsaɪs','精确的'],['promote','prəˈmoʊt','促进；提升'],['relevant','ˈreləvənt','相关的'],['significant','sɪɡˈnɪfɪkənt','重要的'],['sufficient','ˈsʌfɪʃənt','充足的'],['transform','trænsˈfɔːrm','改变'],['vary','ˈveri','变化'],['efficient','ɪˈfɪʃənt','高效的'],['expose','ɪkˈspoʊz','使接触；暴露'],['highlight','ˈhaɪlaɪt','突出；强调'],['restrict','rɪˈstrɪkt','限制'],['analyze','ˈænəlaɪz','分析'],['apparent','əˈpærənt','明显的'],['challenge','ˈtʃælɪndʒ','挑战'],['consume','kənˈsuːm','消耗'],['convey','kənˈveɪ','传达'],['eliminate','ɪˈlɪməneɪt','消除'],['strategy','ˈstrætədʒi','策略']];
const tasks=[['📚','词汇','50个核心词 + 复习旧词','30–40分钟'],['🎧','听力','精听20分钟 + 跟读5句','20–30分钟'],['📖','阅读','1篇四级阅读，限时25分钟','25分钟'],['📝','语法','1个高频专题 + 5道自测','20分钟'],['✍️','写作/翻译','120词短文或1段四级翻译','30分钟'],['📕','错题','把今天错题重新做一遍','10分钟']];
const grammar=[['主谓一致','each、every、either、neither 等后通常接单数谓语。'],['定语从句','先找先行词，再判断关系词在从句中充当什么成分。'],['非谓语动词','判断逻辑主语和时间关系，再选择 to do、doing 或 done。'],['虚拟语气','if、wish、would rather、as if 等结构注意时间错位。'],['倒装','否定副词或 only 放句首时可能触发部分倒装。'],['长难句','先找谓语和主干，再处理从句、非谓语和后置定语。']];
let data={tasks:{},learned:{},wrong:{},total:0,correct:0};try{data=Object.assign(data,JSON.parse(localStorage.getItem('cet4-final')||'{}'))}catch(e){}const today=()=>{const d=new Date();return d.toISOString().slice(0,10)};const D=today();if(!Array.isArray(data.tasks[D]))data.tasks[D]=[false,false,false,false,false,false];function save(){localStorage.setItem('cet4-final',JSON.stringify(data))}function q(s){return document.querySelector(s)}function qa(s){return Array.from(document.querySelectorAll(s))}function say(t){if(window.speechSynthesis){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.86;speechSynthesis.speak(u)}else{toast('浏览器不支持发音')}}function toast(t){const x=q('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}
function home(){const n=data.tasks[D].filter(Boolean).length,p=Math.round(n/6*100);q('#main').innerHTML=`<section class="hero"><div class="eyebrow">CET-4 · 30 DAY SPRINT</div><h1>今天，也向过级走一步。</h1><p>不用想“今天学什么”。打开过级舱，按下面6项任务完成即可。</p><div class="meter"><div class="ring" style="--p:${p}%"><span>${p}%</span></div><div><b>${n}/6</b><small>今日任务完成</small></div></div></section><div class="title"><h2>今日任务</h2><span>${D}</span></div><div class="card">${tasks.map((t,i)=>`<label class="task"><input class="check" data-task="${i}" type="checkbox" ${data.tasks[D][i]?'checked':''}><div><div class="tt">${t[0]} ${t[1]}</div><div class="ts">${t[2]}</div></div><span class="time">${t[3]}</span></label>`).join('')}</div><div class="title"><h2>学习数据</h2></div><div class="grid"><div class="mini"><small>核心词</small><b>${words.length}</b></div><div class="mini"><small>练习正确率</small><b>${data.total?Math.round(data.correct/data.total*100):0}%</b></div></div><div class="title"><h2>30天路线</h2></div><div class="card"><div class="item"><b>01–07 · 抢救词汇</b><p>每天50词 + 基础语法 + 听力。</p></div><div class="item"><b>08–15 · 真题训练</b><p>听力、阅读开始计时，记录错因。</p></div><div class="item"><b>16–23 · 套题强化</b><p>完整套题 + 写作翻译 + 错题二刷。</p></div><div class="item"><b>24–28 · 补弱项</b><p>集中处理最薄弱的题型。</p></div><div class="item"><b>29–30 · 模拟冲刺</b><p>完整模拟，最后一天轻量复盘。</p></div></div>`;qa('[data-task]').forEach(c=>c.onchange=()=>{data.tasks[D][+c.dataset.task]=c.checked;save();home();toast(c.checked?'任务完成 ✓':'已取消')})}
let wi=0;function quiz(){const x=words[wi%words.length],opts=[x,...words.filter(a=>a[0]!==x[0]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);q('#main').innerHTML=`<div class="title"><h2>快速练习</h2><span>看中文选英文</span></div><div class="card wordbox"><div class="phon">${x[1]}</div><div class="mean">${x[2]}</div>${opts.map(o=>`<button class="choice" data-a="${o[0]}">${o[0]}</button>`).join('')}<p class="note" id="fb">先想3秒，再选答案</p></div><div class="card"><div class="btns"><button class="btn" id="speak">🔊 发音</button><button class="btn primary" id="next">下一题</button></div></div>`;q('#speak').onclick=()=>say(x[0]);q('#next').onclick=()=>{wi++;quiz()};qa('[data-a]').forEach(b=>b.onclick=()=>{if(q('#fb').dataset.done)return;const ok=b.dataset.a===x[0];data.total++;if(ok)data.correct++;else data.wrong[x[0]]=(data.wrong[x[0]]||0)+1;q('#fb').dataset.done='1';q('#fb').textContent=ok?'✓ 正确：'+x[0]:'✕ 正确答案：'+x[0];b.classList.add(ok?'ok':'no');if(!ok){const g=q('[data-a="'+x[0]+'"]');if(g)g.classList.add('ok')}save()})}
function wordsPage(){let key='';const draw=()=>{const arr=words.filter(w=>!key||w[0].includes(key.toLowerCase())||w[2].includes(key));q('#main').innerHTML=`<div class="title"><h2>核心词汇</h2><span>${Object.keys(data.learned).length}/${words.length}</span></div><div class="card"><input class="search" id="search" placeholder="搜索英文或中文…"><div>${arr.map(w=>`<div class="row"><div><b>${w[0]}</b><small>${w[2]} · ${w[1]}</small></div><button class="sound" data-w="${w[0]}">🔊</button></div>`).join('')||'<div class="note">没有找到</div>'}</div></div>`;q('#search').value=key;q('#search').oninput=e=>{key=e.target.value;draw()};qa('[data-w]').forEach(b=>b.onclick=()=>{data.learned[b.dataset.w]=1;save();say(b.dataset.w);toast('已学习 '+b.dataset.w)})};draw()}
function wrong(){const arr=Object.keys(data.wrong);q('#main').innerHTML=`<div class="title"><h2>错题本</h2><span>自动保存</span></div><div class="card">${arr.length?arr.map(k=>{const w=words.find(a=>a[0]===k);return `<div class="item"><b>${k}</b><p>${w?w[2]:''} · 错 ${data.wrong[k]} 次</p><div class="btns" style="justify-content:flex-start;margin-top:7px"><button class="btn" data-s="${k}">🔊 发音</button><button class="btn" data-d="${k}">移除</button></div></div>`}).join(''):'<div class="note">还没有错题。去“练习”做几题，错题会自动保存。</div>'}</div>`;qa('[data-s]').forEach(b=>b.onclick=()=>say(b.dataset.s));qa('[data-d]').forEach(b=>b.onclick=()=>{delete data.wrong[b.dataset.d];save();wrong()})}
function more(){q('#main').innerHTML=`<div class="title"><h2>更多</h2></div><div class="card"><div class="item"><b>📝 高频语法</b><p>主谓一致、定语从句、非谓语、虚拟语气、倒装、长难句。</p></div>${grammar.map((g,i)=>`<div class="item"><b>${i+1}. ${g[0]}</b><p>${g[1]}</p></div>`).join('')}<div class="item"><b>📲 添加到手机桌面</b><p>Android Chrome：菜单 → 添加到主屏幕/安装应用。iPhone Safari：分享 → 添加到主屏幕。</p><button class="btn primary" id="install2">安装到手机</button></div></div>`;q('#install2').onclick=installApp}
function go(p){qa('.nav').forEach(n=>n.classList.toggle('active',n.dataset.p===p));({home,words:wordsPage,quiz,wrong,more}[p]||home)();window.scrollTo(0,0)}qa('.nav').forEach(n=>n.onclick=()=>go(n.dataset.p));let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});async function installApp(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else{toast(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'Safari：分享 → 添加到主屏幕':'浏览器菜单 → 添加到主屏幕/安装应用')}}q('#install').onclick=installApp;if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
</script></body></html>
