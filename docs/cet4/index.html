'flexible','ˈfleksəbəl','灵活的'],['global','ˈɡloʊbəl','全球的'],['imply','ɪmˈplaɪ','暗示'],['innovation','ˌɪnəˈveɪʃən','创新'],['issue','ˈɪʃuː','问题；发行'],['modify','ˈmɑːdɪfaɪ','修改'],['obvious','ˈɑːbviəs','明显的'],['participate','pɑːrˈtɪsɪpeɪt','参加'],['perceive','pərˈsiːv','察觉；理解'],['perspective','pərˈspektɪv','观点；视角'],['preserve','prɪˈzɜːrv','保护；保存'],['priority','praɪˈɔːrəti','优先事项'],['pursue','pərˈsuː','追求'],['reduce','rɪˈduːs','减少'],['reliable','rɪˈlaɪəbəl','可靠的'],['require','rɪˈkwaɪər','要求；需要'],['respond','rɪˈspɑːnd','回应'],['resource','ˈriːsɔːrs','资源'],['retain','rɪˈteɪn','保留'],['reveal','rɪˈviːl','揭示'],['shift','ʃɪft','转变；移动'],['strategy','ˈstrætədʒi','策略'],['submit','səbˈmɪt','提交'],['tackle','ˈtækəl','处理；应对'],['trend','trend','趋势'],['unique','juˈniːk','独特的'],['valid','ˈvælɪd','有效的'],['whereas','werˈæz','然而；而'],['widespread','ˈwaɪdspred','广泛的'],['yield','jiːld','产生；屈服']];

const key='cet4v3';let state=JSON.parse(localStorage.getItem(key)||'{}');state.learned=state.learned||{};state.wrong=state.wrong||{};state.total=state.total||0;state.correct=state.correct||0;state.days=state.days||0;state.daily=state.daily||{};state.lastVisit=state.lastVisit||'';const dateKey=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};let todayKey=dateKey();if(state.lastVisit!==todayKey){state.lastVisit=todayKey;state.days++;state.daily[todayKey]=[false,false,false,false,false,false];save()}if(!Array.isArray(state.daily[todayKey]))state.daily[todayKey]=[false,false,false,false,false,false];function save(){localStorage.setItem(key,JSON.stringify(state))}function el(id){return document.getElementById(id)}function toast(t){const x=el('toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1800)}function speakText(t){if('speechSynthesis'in window){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.88;speechSynthesis.speak(u)}}function stats(){el('wordCount').textContent=words.length+' 个';const n=state.daily[todayKey].filter(Boolean).length;el('todayDone').textContent=n+'/6';el('accuracy').textContent=state.total?Math.round(state.correct/state.total*100)+'%':'0%';el('wrongCount').textContent=Object.keys(state.wrong).length;el('studyDays').textContent=state.days}
function renderDaily(){const done=state.daily[todayKey].filter(Boolean).length;const d=new Date();content.innerHTML=`<section class="grid"><div class="card wide"><div class="daybar"><div><div class="daynum">Day ${Math.min(30,state.days)} <span class="date">${todayKey}</span></div><div class="muted">今天只做这6件事，完成就算过关。</div></div><button class="btn" id="resetTasks">↻ 重置今日</button></div><div class="progress"><i id="dailyProg" style="width:${done/6*100}%"></i></div><p class="muted" id="dailyText">今日完成 ${done}/6 · ${done===6?'🎉 今日任务全部完成！':'再完成 '+(6-done)+' 项'}</p>${tasks.map((t,i)=>`<label class="task ${state.daily[todayKey][i]?'done':''}"><input type="checkbox" data-task="${i}" ${state.daily[todayKey][i]?'checked':''}><div><div class="task-title">${t[0]} ${t[1]}</div><small>${t[2]} · ${t[3]}</small></div></label>`).join('')}</div><div class="card"><h2>📅 30天路线</h2><div class="day"><b>Day 1–7 · 抢救词汇</b><span class="muted">每天50词 + 基础语法 + 20分钟听力。</span></div><div class="day"><b>Day 8–15 · 真题训练</b><span class="muted">听力、阅读开始计时，建立错题原因。</span></div><div class="day"><b>Day 16–23 · 套题</b><span class="muted">完整套题 + 写作翻译 + 错题二刷。</span></div><div class="day"><b>Day 24–28 · 补弱项</b><span class="muted">只攻最薄弱的题型和高频词。</span></div><div class="day"><b>Day 29–30 · 模拟</b><span class="muted">Day 29完整模拟，Day 30轻量复盘。</span></div></div><div class="card"><h2>⏱ 25分钟专注</h2><div class="timer" id="clock">25:00</div><div class="actions"><button class="btn primary" id="startTimer">开始</button><button class="btn" id="resetTimer">重置</button></div></div><div class="card"><h2>📲 手机快捷打开</h2><p class="muted">先点右上角“安装到手机”。如果浏览器没有弹出安装选项，也可以使用浏览器菜单里的“添加到主屏幕”。</p><button class="btn install" id="install2">📲 添加到手机桌面</button><div class="install-note" id="installNote">Android：Chrome 菜单 → 添加到主屏幕 / 安装应用。iPhone：Safari 分享 → 添加到主屏幕。</div></div></section>`;document.querySelectorAll('[data-task]').forEach(x=>x.onchange=()=>{state.daily[todayKey][+x.dataset.task]=x.checked;save();renderDaily();stats();if(x.checked)toast('任务完成 ✓')});el('resetTasks').onclick=()=>{state.daily[todayKey]=[false,false,false,false,false,false];save();renderDaily();stats()};bindTimer();el('install2').onclick=installApp}
function renderWords(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>📚 核心词库</h2><input class="search" id="wordSearch" placeholder="搜索英文或中文释义…"><div class="actions" style="margin-top:10px"><button class="btn" id="randomWord">🎲 随机</button><button class="btn" id="onlyNew">只看未掌握</button><button class="btn" id="showAll">全部</button></div><div class="words" id="wordBox"></div></div><div class="card"><h2>今日背词进度</h2><div class="progress"><i id="wordProg"></i></div><p class="muted">已掌握 <b id="learnedCount">0</b> / ${words.length}</p></div><div class="card"><h2>记忆提醒</h2><p class="muted">不要只看中文。点击词卡会播放发音并记录为已学；第二天再用“背单词”主动回忆。</p></div></section>`;const box=el('wordBox');function draw(q='',only=false){let arr=words.filter(w=>(!q||w[0].toLowerCase().includes(q.toLowerCase())||w[2].includes(q))&&(!only||!state.learned[w[0]])).slice(0,72);box.innerHTML=arr.map(w=>`<div class="word" data-word="${w[0]}"><b>${w[0]}</b><span>${w[1]}</span><em>${w[2]}${state.wrong[w[0]]?' · 📕错题':''}</em></div>`).join('')||'<p class="muted">没有找到。</p>';box.querySelectorAll('[data-word]').forEach(card=>card.onclick=()=>{const w=words.find(a=>a[0]===card.dataset.word);state.learned[w[0]]=1;save();speakText(w[0]);toast('已学习：'+w[0]);stats();draw(el('wordSearch').value);updateWordProgress()})}function updateWordProgress(){const n=Object.keys(state.learned).length;el('learnedCount').textContent=n;el('wordProg').style.width=Math.min(100,n/words.length*100)+'%'}draw();el('wordSearch').oninput=e=>draw(e.target.value);el('onlyNew').onclick=()=>draw(el('wordSearch').value,true);el('showAll').onclick=()=>draw(el('wordSearch').value);el('randomWord').onclick=()=>{const w=words[Math.floor(Math.random()*words.length)];el('wordSearch').value=w[0];draw(w[0])};updateWordProgress()}
let qi=0;function renderQuiz(){const x=words[qi%words.length];const opts=[x,...words.filter(w=>w[0]!==x[0]).sort(()=>Math.random()-.5).slice(0,3)].sort(()=>Math.random()-.5);content.innerHTML=`<section class="grid"><div class="card"><h2>⚡ 看中文选英文</h2><div class="quiz"><p>中文：<b>${x[2]}</b></p><p class="muted">音标：${x[1]}</p>${opts.map(o=>`<button class="option" data-answer="${o[0]}">${o[0]}</button>`).join('')}<div class="feedback" id="feedback"></div></div></div><div class="card"><h2>记忆闭环</h2><p class="muted">① 默想英文 → ② 选择 → ③ 朗读 → ④ 造句 → ⑤ 错了就进入错题本。</p><div class="actions"><button class="btn primary" id="sayWord">🔊 朗读</button><button class="btn" id="nextWord">下一词 →</button></div></div></section>`;document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(el('feedback').textContent)return;state.total++;const ok=b.dataset.answer===x[0];if(ok){state.correct++;b.classList.add('ok')}else{b.classList.add('no');document.querySelector(`[data-answer="${x[0]}"]`).classList.add('ok');state.wrong[x[0]]=(state.wrong[x[0]]||0)+1}el('feedback').textContent=ok?'✓ 正确：'+x[0]+' · '+x[2]:'✗ 正确答案：'+x[0]+' · '+x[2];state.daily[todayKey][0]=true;save();stats();speakText(x[0])});el('sayWord').onclick=()=>speakText(x[0]);el('nextWord').onclick=()=>{qi++;renderQuiz()}}
let si=0;function renderSentences(){const x=sentences[si%sentences.length];content.innerHTML=`<section class="grid"><div class="card wide"><h2>🧠 四级高频词句</h2><div class="sentence">${x[0]}</div><p class="cn" id="sentenceCn">${x[1]}</p><div class="actions"><button class="btn primary" id="speakSentence">🔊 听句子</button><button class="btn" id="toggleCn">隐藏/显示中文</button><button class="btn" id="nextSentence">下一句 →</button></div></div><div class="card"><h2>背句法</h2><p class="muted">理解 → 分词块 → 朗读3遍 → 遮住英文 → 根据中文复述 → 第二天再回忆。</p></div></section>`;el('speakSentence').onclick=()=>speakText(x[0]);el('toggleCn').onclick=()=>el('sentenceCn').classList.toggle('hidden');el('nextSentence').onclick=()=>{si++;renderSentences()}}
function renderGrammar(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>📝 四级高频语法</h2>${grammar.map((g,i)=>`<div class="item"><b>${i+1}. ${g[0]} <span class="tag">高频</span></b><span>${g[1]}</span></div>`).join('')}</div><div class="card"><h2>长难句三步法</h2><p class="muted">1. 找谓语；2. 划从句和非谓语；3. 先读主干，再还原修饰信息。</p></div></section>`}
function renderExams(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>📄 历年真题训练区</h2><p class="muted">本站不直接转载未经授权的整套商业试卷，保留年份训练入口和学习方法。</p>${exams.map(e=>`<div class="item"><b>${e[0]} · ${e[1]}</b><span>${e[2]}</span></div>`).join('')}</div><div class="card"><h2>公开开源资源</h2><a class="link" href="https://github.com/MuckeGG/cet-exams" target="_blank" rel="noopener">CET-4/CET-6 真题练习项目 ↗</a><a class="link" href="https://github.com/wamich/english-exem-md" target="_blank" rel="noopener">四六级真题 Markdown 整理 ↗</a><a class="link" href="https://github.com/Liuxiangjian-ai/cet-skill" target="_blank" rel="noopener">CET Skill 趋势与原创训练 ↗</a><a class="link" href="https://github.com/yurow/smart-english" target="_blank" rel="noopener">Smart English 词汇项目 ↗</a></div></section>`)}
function renderWrong(){const arr=Object.keys(state.wrong);content.innerHTML=`<section class="grid"><div class="card wide"><h2>📕 我的错题本</h2><p class="muted">错过的词会自动保存。复习时先自己回忆，再朗读。</p>${arr.length?arr.map(k=>{const w=words.find(a=>a[0]===k);return `<div class="item"><b>${k} <span class="tag">错 ${state.wrong[k]} 次</span></b><span>${w?w[2]:''} · ${w?w[1]:''}</span><div class="actions" style="margin-top:7px"><button class="btn" data-say="${k}">🔊 发音</button><button class="btn" data-del="${k}">移出</button></div></div>`}).join(''):'<p class="muted">暂时没有错题，去“背单词”做几题就会自动记录。</p>')}</div></section>`;document.querySelectorAll('[data-say]').forEach(b=>b.onclick=()=>speakText(b.dataset.say));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{delete state.wrong[b.dataset.del];save();renderWrong();stats()})}
function renderMethods(){content.innerHTML=`<section class="grid"><div class="card wide"><h2>🚀 高效备考方法</h2>${methods.map((m,i)=>`<div class="item"><b>${i+1}. ${m[0]}</b><span>${m[1]}</span></div>`).join('')}</div><div class="card"><h2>今天怎么学</h2><p class="muted">时间少：优先词汇 + 听力 + 真题阅读。时间足：再加入语法、写作和翻译。</p></div></section>`}
let timer=null,sec=1500;function bindTimer(){el('startTimer').onclick=()=>{if(timer)return;timer=setInterval(()=>{sec--;el('clock').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec<=0){clearInterval(timer);timer=null;toast('25分钟完成，休息5分钟再继续')}},1000)};el('resetTimer').onclick=()=>{clearInterval(timer);timer=null;sec=1500;el('clock').textContent='25:00'}}
function render(tab){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));if(tab==='daily')renderDaily();if(tab==='words')renderWords();if(tab==='quiz')renderQuiz();if(tab==='sentences')renderSentences();if(tab==='grammar')renderGrammar();if(tab==='exams')renderExams();if(tab==='wrong')renderWrong();if(tab==='methods')renderMethods();stats();window.scrollTo({top:0,behavior:'smooth'})}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>render(b.dataset.tab));
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;el('installBtn').classList.add('install')});async function installApp(){if(deferredPrompt){deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null}else{toast(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'Safari：分享 → 添加到主屏幕':'请打开浏览器菜单，选择“添加到主屏幕”或“安装应用”')}}el('installBtn').onclick=installApp;if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));render('daily');
</script></body></html>
