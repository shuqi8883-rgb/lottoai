<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f6f7f9"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="CET-4过级舱"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icon.svg"><title>CET-4过级舱</title><style>:root{--bg:#f6f7f9;--card:#fff;--t:#111827;--m:#7d8796;--line:#e7eaf0;--blue:#1677ff;--green:#18a66b;--red:#ff453a;--dark:#111827}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","Microsoft YaHei",sans-serif}.app{max-width:720px;margin:auto;min-height:100vh;padding-bottom:92px}.head{position:sticky;top:0;z-index:10;padding:calc(15px + env(safe-area-inset-top)) 17px 11px;background:#f6f7f9ee;backdrop-filter:blur(20px);border-bottom:1px solid #e7eaf080}.headrow{display:flex;justify-content:space-between;align-items:center}.logo{font-size:22px;font-weight:900}.logo i{font-style:normal;color:var(--blue)}.sub{font-size:11px;color:var(--m);margin-top:3px}.install{border:0;border-radius:18px;padding:9px 13px;background:var(--dark);color:#fff;font-weight:800}.main{padding:10px 15px}.hero{background:var(--dark);color:#fff;border-radius:27px;padding:22px;margin-bottom:16px;position:relative;overflow:hidden}.hero:after{content:'30';position:absolute;right:0;top:-42px;font-size:155px;font-weight:950;color:#fff08}.eyebrow{font-size:10px;color:#aab4c2;font-weight:800;letter-spacing:1px}.hero h1{position:relative;z-index:1;font-size:27px;line-height:1.18;margin:8px 0}.hero p{position:relative;z-index:1;font-size:13px;line-height:1.65;color:#b9c2ce;margin:0}.meter{position:relative;z-index:1;display:flex;align-items:center;gap:12px;margin-top:18px}.ring{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#fff var(--p),#3d4652 0)}.ring span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--dark);font-size:11px;font-weight:900}.meter b{font-size:18px}.meter small{display:block;color:#9da8b5;font-size:11px;margin-top:2px}.title{display:flex;justify-content:space-between;align-items:center;margin:19px 2px 10px}.title h2{font-size:18px;margin:0}.title span{font-size:11px;color:var(--m)}.card{background:var(--card);border:1px solid var(--line);border-radius:21px;padding:16px;margin-bottom:12px;box-shadow:0 8px 28px #18203308}.task{display:flex;align-items:center;gap:11px;padding:14px 2px;border-bottom:1px solid var(--line);cursor:pointer}.task:last-child{border:0}.check{appearance:none;width:25px;height:25px;border:1.5px solid #d2d8e0;border-radius:50%;flex:none}.check:checked{background:var(--green);border-color:var(--green);position:relative}.check:checked:after{content:'✓';color:white;position:absolute;font-weight:900;left:5px;top:1px}.tt{font-size:14px;font-weight:800}.ts{font-size:11px;color:var(--m);margin-top:4px}.time{margin-left:auto;background:#f1f3f6;border-radius:8px;padding:5px 7px;font-size:9px;color:var(--m);white-space:nowrap}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.mini{background:#fff;border:1px solid var(--line);border-radius:17px;padding:14px}.mini small{color:var(--m)}.mini b{display:block;font-size:22px;margin-top:4px}.btns{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:13px;padding:11px 15px;background:#eef1f5;font-weight:800;color:#17202b;cursor:pointer}.primary{background:var(--blue);color:#fff}.choice{display:block;width:100%;padding:13px;border:1px solid var(--line);background:#fff;border-radius:14px;text-align:left;font-size:15px;margin:7px 0;cursor:pointer}.choice.ok{background:#eaf9f1;border-color:var(--green)}.choice.no{background:#fff0ef;border-color:var(--red)}.search{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;outline:0;font-size:14px}.row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.row small{display:block;color:var(--m);margin-top:3px}.sound{border:0;border-radius:50%;width:37px;height:37px;background:#edf4ff;color:var(--blue);cursor:pointer}.note{color:var(--m);font-size:12px;line-height:1.7}.passage{font-size:15px;line-height:1.9;color:#293241}.question{font-size:16px;font-weight:800;line-height:1.6}.answer{margin-top:12px;padding:13px;border-radius:14px;background:#f5f7fa;font-size:13px;line-height:1.7}.textarea{width:100%;min-height:170px;resize:vertical;border:1px solid var(--line);border-radius:15px;padding:13px;font:14px/1.8 inherit;outline:0}.subnav{display:flex;gap:7px;overflow:auto;padding:2px 0 10px;scrollbar-width:none}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 12px;font-size:12px;font-weight:800;color:#687386}.chip.active{background:#eaf2ff;color:var(--blue);border-color:#bcd6ff}.item{padding:13px 0;border-bottom:1px solid var(--line)}.item:last-child{border:0}.item b{font-size:14px}.item p{font-size:12px;color:#697386;line-height:1.7;margin:5px 0 0}.tag{display:inline-block;background:#eef4ff;color:var(--blue);border-radius:7px;padding:4px 7px;font-size:10px}.bottom{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(720px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:7px 7px calc(7px + env(safe-area-inset-bottom));background:#ffffffef;backdrop-filter:blur(20px);border-top:1px solid var(--line)}.nav{border:0;background:none;color:#9aa3ae;font-size:10px;font-weight:800;cursor:pointer}.nav b{display:block;font-size:20px;line-height:21px;margin-bottom:2px}.nav.active{color:var(--blue)}.toast{position:fixed;z-index:30;left:50%;bottom:105px;transform:translate(-50%,12px);background:var(--dark);color:#fff;padding:10px 15px;border-radius:20px;font-size:12px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}@media(max-width:420px){.main{padding:9px 12px}.hero h1{font-size:24px}.hero{padding:19px}.time{display:none}}</style></head><body><div class="app"><header class="head"><div class="headrow"><div><div class="logo">CET-4 <i>过级舱</i></div><div class="sub">30天冲刺 · 今日任务 · 真题专项</div></div><button class="install" id="install">＋ 安装</button></div></header><main class="main" id="main"></main><nav class="bottom"><button class="nav active" data-p="home"><b>⌂</b>今日</button><button class="nav" data-p="words"><b>Aa</b>词汇</button><button class="nav" data-p="practice"><b>✓</b>练习</button><button class="nav" data-p="wrong"><b>♡</b>错题</button><button class="nav" data-p="more"><b>•••</b>更多</button></nav></div><div class="toast" id="toast"></div><script>
const words=[['abandon','əˈbændən','放弃'],['absorb','əbˈzɔːrb','吸收；理解'],['accurate','ˈækjərət','准确的'],['adapt','əˈdæpt','适应'],['adequate','ˈædəkwət','足够的'],['advocate','ˈædvəkeɪt','提倡'],['approach','əˈproʊtʃ','方法；接近'],['assume','əˈsuːm','假定'],['beneficial','ˌbenɪˈfɪʃəl','有益的'],['capacity','kəˈpæsəti','能力'],['circumstance','ˈsɜːrkəmstæns','情况'],['contribute','kənˈtrɪbjuːt','贡献；促成'],['crucial','ˈkruːʃəl','关键的'],['decline','dɪˈklaɪn','下降；拒绝'],['demonstrate','ˈdemənstreɪt','证明；展示'],['distinguish','dɪˈstɪŋɡwɪʃ','区分'],['diverse','daɪˈvɜːrs','多样的'],['emerge','ɪˈmɜːrdʒ','出现'],['enhance','ɪnˈhæns','提高；增强'],['essential','ˈesəntʃəl','必要的'],['evaluate','ɪˈvæljueɪt','评估'],['evidence','ˈevɪdəns','证据'],['frequent','ˈfriːkwənt','频繁的'],['fundamental','ˌfʌndəˈmentəl','基本的'],['generate','ˈdʒenəreɪt','产生'],['impact','ˈɪmpækt','影响'],['indicate','ˈɪndɪkeɪt','表明'],['inevitable','ɪnˈevɪtəbəl','不可避免的'],['interpret','ɪnˈtɜːrprət','解释'],['maintain','meɪnˈteɪn','维持'],['obtain','əbˈteɪn','获得'],['potential','pəˈtenʃəl','潜力'],['precise','prɪˈsaɪs','精确的'],['promote','prəˈmoʊt','促进'],['relevant','ˈreləvənt','相关的'],['significant','sɪɡˈnɪfɪkənt','重要的'],['sufficient','ˈsʌfɪʃənt','充足的'],['transform','trænsˈfɔːrm','改变'],['vary','ˈveri','变化'],['efficient','ɪˈfɪʃənt','高效的'],['expose','ɪkˈspoʊz','使接触'],['highlight','ˈhaɪlaɪt','突出'],['restrict','rɪˈstrɪkt','限制'],['analyze','ˈænəlaɪz','分析'],['apparent','əˈpærənt','明显的'],['challenge','ˈtʃælɪndʒ','挑战'],['consume','kənˈsuːm','消耗'],['convey','kənˈveɪ','传达'],['eliminate','ɪˈlɪməneɪt','消除'],['strategy','ˈstrætədʒi','策略']];
const tasks=[['📚','词汇','50个核心词 + 复习旧词','30–40分钟'],['🎧','听力','完成听力训练 + 跟读5句','20–30分钟'],['📖','阅读','完成1篇四级阅读，限时25分钟','25分钟'],['📝','语法','完成10道高频语法题','20分钟'],['✍️','写作/翻译','完成1道并查看参考答案','30分钟'],['📕','错题','重新完成今天的错题','10分钟']];
const listenQs=[['Are you going to the library this afternoon? I planned to, but I have to finish my report first. What will the woman probably do first?',['Go to the library','Finish her report','Meet her friend','Take an exam'],1],['How did you like the lecture? It was interesting, but the speaker talked too fast. What does the man imply?',['The lecture was canceled.','The speaker was boring.','The lecture was interesting but difficult to follow.','He arrived late.'],2],['Would you like some coffee? Thanks, but I have already had two cups today. What does the woman mean?',['She wants tea.','She does not want more coffee.','She has no time.','She dislikes coffee.'],1],['The bus leaves at eight. Then we had better leave now. What does the man suggest?',['Waiting for the next bus.','Taking a taxi tomorrow.','Leaving now.','Canceling the trip.'],2],['Did Sarah submit the assignment? Not yet. She said she would do it tonight. What do we learn about Sarah?',['She has submitted it.','She lost it.','She will probably submit it tonight.','She does not need to submit it.'],2]];
const readingSets=[{title:'Reading 1',text:'Many students believe that effective learning means spending as many hours as possible at a desk. In fact, the quality of attention matters more than the number of hours. Short periods of focused study, followed by brief breaks, can help learners maintain attention. It is also useful to test yourself instead of simply reading notes again. When you try to recall information without looking at the answer, your brain has to work harder, which can strengthen memory.',qs:[['What does the passage mainly emphasize?',['Long study hours are always necessary.','Quality of attention and active recall are important for learning.','Students should avoid taking breaks.','Reading notes is better than testing yourself.'],1],['Why does active recall help memory?',['Because it makes the brain work harder.','Because it requires longer study hours.','Because it removes all mistakes.','Because it replaces sleep.'],0]]},{title:'Reading 2',text:'Cities are increasingly creating spaces for walking and cycling. Supporters say these changes can reduce traffic and make neighborhoods more pleasant. However, simply building a bike lane does not guarantee that people will use it. Safety, convenience, connections to other routes, and public awareness all influence whether residents change their travel habits. Therefore, transport planning usually needs to consider several factors together.',qs:[['What is the main point of the passage?',['Bike lanes are useless in cities.','People never change travel habits.','Transport planning should consider several factors.','Walking is always better than cycling.'],2],['Which factor is mentioned as influencing whether people use bike lanes?',['The price of houses.','Safety.','The weather forecast only.','School grades.'],1]]}];
const grammarQs=[['If I ___ enough time tomorrow, I will help you.',['have','had','will have','having'],0],['Neither the teacher nor the students ___ aware of the change.',['was','were','be','has'],1],['The book ___ by a famous scientist is worth reading.',['writing','written','write','was written'],1],['It is important that every student ___ on time.',['is','be','was','being'],1],['The more you practice, the ___ you become.',['confident','more confident','most confident','confidence'],1],['Only after the meeting ___ the problem clearly.',['we understood','did we understand','we understand','understood we'],1],['She suggested ___ the problem in another way.',['solve','to solve','solving','solved'],2],['The man ___ lives next door is a doctor.',['which','whose','who','where'],2],['If I were you, I ___ this opportunity.',['will take','would take','take','took'],1],['Technology has greatly ___ the way people communicate.',['changed','changing','change','changes'],0]];
const writingSets=[['写作','The Importance of Good Study Habits','建议至少120词：观点 → 理由 → 行动 → 总结。','Good study habits play an important role in academic success. First, making a clear plan helps students use their time efficiently. Instead of studying only before an exam, we can review a little every day. Second, active learning is more effective than simply reading notes. We should ask ourselves questions, practice what we have learned and correct our mistakes. Finally, enough sleep and short breaks help us maintain concentration. In my view, small actions repeated every day can make a big difference.'],['翻译','中国学生越来越重视英语学习。除了记忆词汇，我们还应该通过阅读、听力和实际交流提高英语能力。只要坚持每天练习，就能逐渐取得进步。','注意：越来越……；除了……还……；只要……就……。','Chinese students are paying more and more attention to English learning. Besides memorizing vocabulary, we should also improve our English ability through reading, listening and real communication. As long as we keep practicing every day, we can make steady progress.']];
let data={tasks:{},learned:{},wrong:{},total:0,correct:0};try{data=Object.assign(data,JSON.parse(localStorage.getItem('cet4-app-v3')||'{}'))}catch(e){}const D=new Date().toLocaleDateString('en-CA');if(!Array.isArray(data.tasks[D]))data.tasks[D]=[false,false,false,false,false,false];function save(){localStorage.setItem('cet4-app-v3',JSON.stringify(data))}function q(s){return document.querySelector(s)}function qa(s){return Array.from(document.querySelectorAll(s))}function toast(t){const x=q('#toast');x.textContent=t;x.classList.add('show');setTimeout(()=>x.classList.remove('show'),1500)}function say(t){if(!('speechSynthesis'in window)){toast('浏览器不支持语音');return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.82;speechSynthesis.speak(u)}
function home(){const n=data.tasks[D].filter(Boolean).length,p=Math.round(n/6*100);q('#main').innerHTML=`<section class="hero"><div class="eyebrow">CET-4 · 30 DAY SPRINT</div><h1>今天，也向过级走一步。</h1><p>听力、阅读、语法、写作翻译，现在都可以直接在这里做题。</p><div class="meter"><div class="ring" style="--p:${p}%"><span>${p}%</span></div><div><b>${n}/6</b><small>今日任务完成</small></div></div></section><div class="title"><h2>今日任务</h2><span>${D}</span></div><div class="card">${tasks.map((t,i)=>`<div class="task" data-task="${i}"><input class="check" type="checkbox" ${data.tasks[D][i]?'checked':''}><div><div class="tt">${t[0]} ${t[1]}</div><div class="ts">${t[2]}</div></div><span class="time">${t[3]}</span></div>`).join('')}</div><div class="title"><h2>学习数据</h2></div><div class="grid"><div class="mini"><small>核心词</small><b>${words.length}</b></div><div class="mini"><small>练习正确率</small><b>${data.total?Math.round(data.correct/data.total*100):0}%</b></div></div>`;qa('[data-task]').forEach(x=>x.onclick=e=>{const i=+x.dataset.task;if(e.target.classList.contains('check'))return;data.tasks[D][i]=!data.tasks[D][i];save();home()});qa('.check').forEach(c=>c.onchange=()=>{const i=+c.closest('[data-task]').dataset.task;data.tasks[D][i]=c.checked;save();home()})}
function wordsPage(){let key='';function draw(){const arr=words.filter(w=>!key||w[0].toLowerCase().includes(key.toLowerCase())||w[2].includes(key));q('#main').innerHTML=`<div class="title"><h2>核心词汇</h2><span>${Object.keys(data.learned).length}/${words.length}</span></div><div class="card"><input class="search" id="search" placeholder="搜索英文或中文…"><div>${arr.map(w=>`<div class="row"><div><b>${w[0]}</b><small>${w[2]} · ${w[1]}</small></div><button class="sound" data-w="${w[0]}">🔊</button></div>`).join('')}</div></div>`;q('#search').value=key;q('#search').oninput=e=>{key=e.target.value;draw()};qa('[data-w]').forEach(b=>b.onclick=()=>{data.learned[b.dataset.w]=1;save();say(b.dataset.w);toast('已学习 '+b.dataset.w)})}draw()}
let li=0;function listeningPage(){const x=listenQs[li%listenQs.length];q('#main').innerHTML=`<div class="title"><h2>🎧 听力训练</h2><span>${li%listenQs.length+1}/${listenQs.length}</span></div><div class="card"><button class="btn primary" id="play">▶ 播放听力</button><p class="note">先不要看文字，播放2遍再答题。</p><div class="question">听力问题：${x[0]}</div>${x[1].map((o,i)=>`<button class="choice" data-l="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<p class="note" id="lfb">选择答案后自动判分</p></div><div class="card"><div class="btns"><button class="btn" id="repeat">🔁 再听</button><button class="btn primary" id="lnext">下一题 →</button></div></div>`;q('#play').onclick=()=>say(x[0]);q('#repeat').onclick=()=>say(x[0]);q('#lnext').onclick=()=>{li++;listeningPage()};qa('[data-l]').forEach(b=>b.onclick=()=>{if(q('#lfb').dataset.done)return;const ok=+b.dataset.l===x[2];data.total++;if(ok)data.correct++;if(!ok)data.wrong['听力'+li]=(data.wrong['听力'+li]||0)+1;b.classList.add(ok?'ok':'no');if(!ok)qa('[data-l]').find(z=>+z.dataset.l===x[2]).classList.add('ok');q('#lfb').dataset.done='1';q('#lfb').textContent=ok?'✓ 正确':'✕ 正确答案：'+String.fromCharCode(65+x[2]);save()})}
let ri=0;function readingPage(){const x=readingSets[ri%readingSets.length];q('#main').innerHTML=`<div class="title"><h2>📖 阅读训练</h2><span>${x.title}</span></div><div class="card"><p class="passage">${x.text}</p></div>${x.qs.map((z,j)=>`<div class="card"><div class="question">${j+1}. ${z[0]}</div>${z[1].map((o,k)=>`<button class="choice" data-r="${j}-${k}">${String.fromCharCode(65+k)}. ${o}</button>`).join('')}<p class="note" id="rf${j}">选择答案</p></div>`).join('')}<div class="card"><div class="btns"><button class="btn primary" id="rnext">下一篇 →</button></div></div>`;x.qs.forEach((z,j)=>qa('[data-r]').filter(b=>b.dataset.r.startsWith(j+'-')).forEach(b=>b.onclick=()=>{if(q('#rf'+j).dataset.done)return;const k=+b.dataset.r.split('-')[1],ok=k===z[2];data.total++;if(ok)data.correct++;if(!ok)data.wrong['阅读'+ri+'-'+j]=(data.wrong['阅读'+ri+'-'+j]||0)+1;b.classList.add(ok?'ok':'no');if(!ok)qa('[data-r]').filter(c=>c.dataset.r.startsWith(j+'-')).find(c=>+c.dataset.r.split('-')[1]===z[2]).classList.add('ok');q('#rf'+j).dataset.done='1';q('#rf'+j).textContent=ok?'✓ 正确':'✕ 正确答案：'+String.fromCharCode(65+z[2]);save()}));q('#rnext').onclick=()=>{ri++;readingPage()}}
let gi=0;function grammarPage(){const x=grammarQs[gi%grammarQs.length];q('#main').innerHTML=`<div class="title"><h2>📝 语法专项</h2><span>${gi%grammarQs.length+1}/${grammarQs.length}</span></div><div class="card"><div class="question">${x[0]}</div>${x[1].map((o,i)=>`<button class="choice" data-g="${i}">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<p class="note" id="gfb">选择答案</p></div><div class="card"><div class="btns"><button class="btn primary" id="gnext">下一题 →</button></div></div>`;qa('[data-g]').forEach(b=>b.onclick=()=>{if(q('#gfb').dataset.done)return;const ok=+b.dataset.g===x[2];data.total++;if(ok)data.correct++;if(!ok)data.wrong['语法'+gi]=(data.wrong['语法'+gi]||0)+1;b.classList.add(ok?'ok':'no');if(!ok)qa('[data-g]').find(c=>+c.dataset.g===x[2]).classList.add('ok');q('#gfb').dataset.done='1';q('#gfb').textContent=ok?'✓ 正确':'✕ 正确答案：'+String.fromCharCode(65+x[2])+' · '+x[1][x[2]];save()});q('#gnext').onclick=()=>{gi++;grammarPage()}}
let wi=0;function writingPage(){const x=writingSets[wi%writingSets.length];q('#main').innerHTML=`<div class="title"><h2>✍️ 写作 / 翻译</h2><span>${x[0]}</span></div><div class="card"><div class="question">${x[1]}</div><p class="note">${x[2]}</p><textarea class="textarea" id="essay" placeholder="在这里输入你的答案……"></textarea><div class="btns" style="margin-top:10px"><button class="btn primary" id="showModel">查看参考答案</button><button class="btn" id="wnext">下一题 →</button></div><div class="answer" id="model" style="display:none"><b>参考答案</b><br>${x[3]}</div></div>`;q('#showModel').onclick=()=>{const m=q('#model');m.style.display=m.style.display==='none'?'block':'none'};q('#wnext').onclick=()=>{wi++;writingPage()}}
function practice(){q('#main').innerHTML=`<div class="title"><h2>专项练习</h2><span>现在可以直接做题</span></div><div class="subnav"><button class="chip active" data-x="listen">🎧 听力</button><button class="chip" data-x="read">📖 阅读</button><button class="chip" data-x="gram">📝 语法</button><button class="chip" data-x="write">✍️ 写作/翻译</button></div><div class="card"><h2>选择一个专项</h2><p class="note">听力可以播放并自动判题；阅读有文章和题目；语法自动统计正确率；写作/翻译可以输入答案后查看参考答案。</p><div class="grid"><button class="btn primary" data-open="listen">🎧 开始听力</button><button class="btn" data-open="read">📖 开始阅读</button><button class="btn" data-open="gram">📝 开始语法</button><button class="btn" data-open="write">✍️ 写作翻译</button></div></div>`;const map={listen:listeningPage,read:readingPage,gram:grammarPage,write:writingPage};qa('[data-x]').forEach(b=>b.onclick=()=>{qa('.chip').forEach(c=>c.classList.remove('active'));b.classList.add('active');map[b.dataset.x]()});qa('[data-open]').forEach(b=>b.onclick=()=>map[b.dataset.open]())}
function wrongPage(){const arr=Object.keys(data.wrong);q('#main').innerHTML=`<div class="title"><h2>错题本</h2><span>${arr.length} 道</span></div><div class="card">${arr.length?arr.map(k=>`<div class="item"><b>${k}</b><p>错误次数：${data.wrong[k]}</p></div>`).join(''):'<div class="note">还没有错题。去练习做题，错题会自动保存。</div>'}</div>`}
function more(){q('#main').innerHTML=`<div class="title"><h2>更多</h2></div><div class="card"><div class="item"><b>📚 30天路线</b><p>1–7天抢救词汇；8–15天听力阅读；16–23天套题；24–28天补弱项；29–30天模拟冲刺。</p></div><div class="item"><b>📊 学习数据</b><p>已做 ${data.total} 题 · 正确率 ${data.total?Math.round(data.correct/data.total*100):0}%</p></div><div class="item"><b>📲 iPhone桌面</b><p>Safari打开本网站 → 分享 → 添加到主屏幕。</p></div></div>`}
function go(p){qa('.nav').forEach(n=>n.classList.toggle('active',n.dataset.p===p));({home,words:wordsPage,practice,wrong:wrongPage,more}[p]||home)();window.scrollTo(0,0)}qa('.nav').forEach(n=>n.onclick=()=>go(n.dataset.p));let deferred=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e});async function installApp(){if(deferred){deferred.prompt();await deferred.userChoice;deferred=null}else toast(/iPhone|iPad|iPod/i.test(navigator.userAgent)?'Safari：分享 → 添加到主屏幕':'浏览器菜单 → 添加到主屏幕/安装应用')}q('#install').onclick=installApp;if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));home();
</script></body></html>
