<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="LottoAI 彩票数据研究站：双色球、大乐透历史数据、统计分析与候选组合。">
<link rel="manifest" href="manifest.json">
<title>LottoAI · 彩票数据研究站</title>
<style>
:root{--bg:#06101d;--panel:#0b1a2d;--panel2:#10243b;--line:#203b5c;--text:#eef5ff;--muted:#91a8c4;--blue:#43a5ff;--blue2:#1769a8;--red:#ef4444;--green:#35d28a;--gold:#ffc857;--shadow:0 20px 60px #0008}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#123761 0,#071522 36%,#040b14 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}
button{font:inherit}.wrap{width:min(1100px,100%);margin:auto;padding:18px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900;letter-spacing:-.5px}.brand .dot{display:grid;place-items:center;width:40px;height:40px;border-radius:13px;background:linear-gradient(145deg,#fff,#bfe2ff);color:#09203a;font-size:22px;box-shadow:0 7px 25px #0005}.brand span{color:var(--blue)}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.refresh{border:1px solid #2f6d9f;background:#0c2a46;color:#eaf6ff;border-radius:12px;padding:10px 15px;cursor:pointer;box-shadow:0 8px 22px #0003}.refresh:active,.tab:active,button:active{transform:scale(.98)}
.tabs{display:flex;gap:9px;margin-bottom:16px}.tab{flex:1;max-width:180px;border:1px solid #1f3b59;background:#081728;color:#91a9c5;border-radius:15px;padding:11px 14px;cursor:pointer;font-weight:750}.tab.active{background:linear-gradient(180deg,#144c78,#0c3153);border-color:#2e78b0;color:#fff;box-shadow:0 8px 28px #0005}
.hero-card,.card{border:1px solid var(--line);background:linear-gradient(145deg,#0d2137,#091727);border-radius:22px;box-shadow:var(--shadow)}.hero-card{padding:20px;margin-bottom:18px;overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;width:250px;height:250px;right:-100px;top:-130px;background:#2c9dff22;border-radius:50%;filter:blur(8px)}.hero-top{display:flex;justify-content:space-between;gap:15px;position:relative;z-index:1}.eyebrow{font-size:11px;letter-spacing:2px;color:#6dbfff;font-weight:800}.hero-card h1{margin:4px 0 3px;font-size:28px}.hero-card p{margin:0;color:var(--muted);font-size:13px}.status{height:max-content;border:1px solid #23583f;background:#0b2b20;color:#7ee8b4;border-radius:999px;padding:6px 10px;font-size:11px}.status i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin-right:5px}.draw-label{margin-top:20px;color:#90a9c4;font-size:12px}.balls{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.balls.big{margin:9px 0 16px;gap:8px}.ball{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 28%,#ff8b8b,#e52e3d 60%,#9e1320);font-weight:900;font-size:14px;box-shadow:inset 0 -5px 8px #0005,0 5px 12px #0004}.ball.blue{background:radial-gradient(circle at 35% 28%,#77c8ff,#187bd0 60%,#08497e)}.ball.mini{width:25px;height:25px;font-size:10px;box-shadow:none}.divider{color:#7892ad;font-weight:900;margin:0 1px}.hero-metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}.hero-metrics div{display:flex;flex-direction:column;gap:3px}.hero-metrics span{font-size:10px;color:var(--muted)}.hero-metrics b{font-size:15px}
.section-title{display:flex;justify-content:space-between;align-items:end;margin:24px 2px 10px}.section-title b{font-size:20px}.section-title span{font-size:12px;color:var(--muted);margin-left:9px}.grid{display:grid;gap:14px}.grid.two{grid-template-columns:repeat(2,1fr)}.wide{grid-column:1/-1}.card{padding:17px}.card h2{font-size:16px;margin:0 0 12px}.hint{font-size:11px;color:var(--muted);line-height:1.6;margin:10px 0 0}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-width:31px;height:31px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:#0c2943;border:1px solid #21496b;color:#cdeaff;font-weight:800;font-size:12px}.metric{display:grid;grid-template-columns:1fr auto;gap:7px;align-items:center;padding:9px 0;border-bottom:1px solid #17304a}.metric:last-child{border-bottom:0}.metric span{color:#b3c5d9;font-size:12px}.metric strong{font-size:14px}.metric small{grid-column:1/-1;color:#6f88a3;font-size:10px;margin-top:-4px}
.recommendation{margin-top:14px}.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-head h2{margin-bottom:3px}.section-head p{margin:0;color:var(--muted);font-size:11px}.section-head button{border:1px solid #2d6c99;background:#0d2e4b;color:#dff2ff;border-radius:10px;padding:7px 11px;cursor:pointer}.candidate{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid #17304a}.candidate:last-child{border-bottom:0}.candidate.featured{margin:0 -8px;padding:13px 8px;border-radius:14px;background:#0d2841}.rank{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#132b44;color:#86b8df;font-weight:900;font-size:12px}.candidate-main{min-width:0;flex:1}.score{margin-top:5px;color:#718ca8;font-size:10px}.score b{color:#bfe3ff}.tag{font-size:9px;border:1px solid #6b5319;background:#33270d;color:#ffd66f;border-radius:999px;padding:4px 7px;white-space:nowrap}.recent{display:grid;gap:2px}.recent-row{display:grid;grid-template-columns:54px 1fr 78px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #142b42}.recent-row:last-child{border-bottom:0}.recent-row>span{font-size:10px;color:#9ab0c7}.recent-row em{font-style:normal;font-size:9px;color:#647f9c;text-align:right}.recent-row .balls{gap:3px}.logic .metric{grid-template-columns:1fr auto}.research{display:grid;grid-template-columns:1fr 1fr;gap:9px}.research span{font-size:11px;padding:8px 9px;border-radius:9px;background:#0a1b2d}.research .ok{color:#76e7ad}.research .wait{color:#e4c36c}.notice{margin-top:14px;color:#a7b9cc;line-height:1.7;font-size:11px}.notice b{color:#dcecff}.notice p{margin:7px 0 0}.loading{text-align:center;padding:45px 20px;color:var(--muted)}.loading h2{color:#d9e8f8;margin-top:12px}.spinner{width:28px;height:28px;border:3px solid #254461;border-top-color:#59b7ff;border-radius:50%;margin:auto;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.error{text-align:center;padding:40px 18px}.error-icon{width:42px;height:42px;margin:auto;border-radius:50%;display:grid;place-items:center;background:#3a1c20;color:#ff9ca4;font-weight:900}.error p{color:var(--muted);font-size:12px}.error small{color:#59718a}
@media(max-width:700px){.wrap{padding:12px 12px 40px}.top{padding-bottom:13px}.brand{font-size:21px}.brand .dot{width:35px;height:35px}.subtitle{font-size:10px}.refresh{padding:8px 11px}.hero-card{padding:16px;border-radius:19px}.hero-card h1{font-size:24px}.hero-metrics{grid-template-columns:repeat(2,1fr);row-gap:12px}.grid.two{grid-template-columns:1fr}.wide{grid-column:auto}.card{border-radius:18px;padding:15px}.ball{width:34px;height:34px}.balls.big .ball{width:35px;height:35px}.candidate .ball{width:32px;height:32px;font-size:12px}.recent-row{grid-template-columns:48px 1fr 70px}.tab{max-width:none}.research{grid-template-columns:1fr 1fr}}
@media(min-width:701px){.wrap{padding-top:26px}.hero-card{padding:26px}.grid.two{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header class="top">
  <div><div class="brand"><span class="dot">🎯</span><span>Lotto<span>AI</span></span></div><div class="subtitle">数据 · 统计 · 回测 · 候选组合 · 自动更新</div></div>
  <button class="refresh" id="refresh">↻ 刷新数据</button>
</header>
<nav class="tabs" aria-label="彩票类型"><button class="tab active" data-game="ssq">双色球</button><button class="tab" data-game="dlt">大乐透</button></nav>
<main id="app"></main>
</div>
<script src="app.js"></script>
</body>
</html>
