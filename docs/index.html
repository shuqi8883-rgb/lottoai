<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta name="description" content="LottoAI 彩票数据研究站：双色球、大乐透历史数据、统计分析与候选组合。">
<link rel="manifest" href="manifest.json?v=3">
<title>LottoAI · 最终版</title>
<style>
:root{--bg:#06101d;--panel:#0b1a2d;--line:#203b5c;--text:#eef5ff;--muted:#91a8c4;--blue:#43a5ff;--green:#35d28a;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% -10%,#123761 0,#071522 36%,#040b14 100%);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}.wrap{width:min(1100px,100%);margin:auto;padding:18px 18px 50px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:4px 0 18px}.brand{display:flex;align-items:center;gap:10px;font-size:25px;font-weight:900}.dot{display:grid;place-items:center;width:42px;height:42px;border-radius:14px;background:#fff;color:#0a3155;font-size:23px}.brand span span{color:var(--blue)}.subtitle{font-size:12px;color:var(--muted);margin-top:3px}.refresh,.tab{border:1px solid #2f6d9f;background:#0c2a46;color:#eaf6ff;border-radius:12px;padding:10px 15px;cursor:pointer}.tabs{display:flex;gap:9px;margin-bottom:16px}.tab{flex:1;max-width:180px;background:#081728;color:#91a9c5;font-weight:750}.tab.active{background:#144c78;border-color:#2e78b0;color:#fff}.card,.hero{border:1px solid var(--line);background:linear-gradient(145deg,#0d2137,#091727);border-radius:22px;box-shadow:0 20px 60px #0008}.hero{padding:20px;margin-bottom:18px}.hero h1{margin:5px 0;font-size:28px}.muted{color:var(--muted)}.balls{display:flex;flex-wrap:wrap;align-items:center;gap:7px}.big{margin:14px 0}.ball{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#e52e3d;font-weight:900}.ball.blue{background:#187bd0}.mini{width:25px;height:25px;font-size:10px}.divider{margin:0 2px;color:#7892ad;font-weight:900}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;border-top:1px solid var(--line);padding-top:14px}.metrics div{display:flex;flex-direction:column;gap:4px}.metrics span{font-size:10px;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.card{padding:17px}.card h2{font-size:16px;margin:0 0 12px}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{min-width:32px;height:32px;padding:0 8px;border-radius:10px;display:grid;place-items:center;background:#0c2943;border:1px solid #21496b;color:#cdeaff;font-weight:800}.metric{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid #17304a}.metric span{color:#b3c5d9;font-size:12px}.wide{grid-column:1/-1}.recommend{margin-top:14px}.head{display:flex;justify-content:space-between;align-items:center}.head button{border:1px solid #2d6c99;background:#0d2e4b;color:#dff2ff;border-radius:10px;padding:7px 11px}.candidate{display:flex;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #17304a}.rank{width:26px;height:26px;display:grid;place-items:center;border-radius:8px;background:#132b44;font-weight:900}.main{flex:1}.score{font-size:10px;color:#718ca8;margin-top:5px}.loading{text-align:center;padding:50px 20px}.spinner{width:30px;height:30px;border:3px solid #254461;border-top-color:#59b7ff;border-radius:50%;margin:auto;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}.error{text-align:center;padding:40px 18px}.notice{margin-top:14px;line-height:1.7;font-size:11px;color:#a7b9cc}.recent-row{display:grid;grid-template-columns:60px 1fr 90px;gap:7px;align-items:center;padding:7px 0;border-bottom:1px solid #142b42;font-size:10px}.recent-row em{font-style:normal;text-align:right;color:#647f9c}@media(max-width:700px){.wrap{padding:12px}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.metrics{grid-template-columns:1fr 1fr}.tab{max-width:none}.hero h1{font-size:24px}.recent-row{grid-template-columns:48px 1fr 70px}}
</style>
</head>
<body><div class="wrap">
<header class="top"><div><div class="brand"><div class="dot">🎯</div><span>Lotto<span>AI</span></span></div><div class="subtitle">数据 · 统计 · 回测 · 候选组合 · 每日更新</div></div><button class="refresh" id="refresh">↻ 刷新数据</button></header>
<nav class="tabs"><button class="tab active" data-game="ssq">双色球</button><button class="tab" data-game="dlt">大乐透</button></nav>
<main id="app"><section class="card loading"><div class="spinner"></div><h2>正在加载 LottoAI…</h2><p class="muted">正在读取最新开奖数据</p></section></main>
</div>
<script src="app.js?v=20260915-final2"></script>
</body></html>
