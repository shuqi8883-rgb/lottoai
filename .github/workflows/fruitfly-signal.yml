name: FruitFly Live Signal
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate read-only signal
        working-directory: scripts
        run: python fruitfly_live.py
      - name: Send optional Telegram notification
        working-directory: scripts
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python fruitfly_notify.py
      - name: Commit signal snapshot and notification state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/flytrade/signal.json docs/flytrade/notify-state.json
          git diff --cached --quiet || git commit -m 'chore: update FruitFly live signal'
          git push
