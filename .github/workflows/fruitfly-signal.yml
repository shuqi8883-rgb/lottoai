name: FruitFly Live Signal
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  signal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate read-only signal snapshot
        working-directory: scripts
        run: python fruitfly_live.py
      - name: Commit signal snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/flytrade/signal.json
          git diff --cached --quiet || git commit -m 'chore: update FruitFly live signal'
          git push
