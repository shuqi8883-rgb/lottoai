name: FruitFly Brain research test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fruitfly_brain.py'
      - 'scripts/fruitfly_fixture.csv'
      - '.github/workflows/fruitfly-test.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/fruitfly_brain.py
      - name: Deterministic backtest
        run: python scripts/fruitfly_brain.py scripts/fruitfly_fixture.csv
