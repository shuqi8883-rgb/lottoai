name: FruitFly Paper Lab
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run public-data paper backtest
        working-directory: scripts
        run: python fruitfly_paper.py
      - name: Publish latest paper result
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/flytrade/latest.json
          git diff --cached --quiet || git commit -m 'chore: update FruitFly paper result'
          git push
