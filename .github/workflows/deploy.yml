name: LottoAI data sync and Pages deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "lottoai-pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update graduate jobs and company directory
        run: python scripts/update_jobs_daily.py

      - name: Download latest lottery data
        run: |
          set -e
          mkdir -p docs/data
          curl -L --fail --retry 3 -o docs/data/ssq.json https://raw.githubusercontent.com/yangxb919/lottery-data/main/data/ssq.json
          curl -L --fail --retry 3 -o docs/data/dlt.json https://raw.githubusercontent.com/yangxb919/lottery-data/main/data/dlt.json
          python - <<'PY'
          import json
          for p in ('docs/data/ssq.json','docs/data/dlt.json'):
              with open(p, encoding='utf-8') as f: data=json.load(f)
              assert isinstance(data,list) and data, p
              print(p, 'records:', len(data), 'latest:', data[0].get('issue'))
          PY

      - name: Sync football and basketball fixtures/results
        run: python scripts/update_sports.py

      - name: Activate sports display fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="sports-fix.js?v=20260915-1"></script>'
          if tag not in s:
              if '</body>' in s:
                  s = s.replace('</body>', tag + '</body>')
              else:
                  s += tag
              p.write_text(s, encoding='utf-8')
          print('sports display fix activated')
          PY

      - name: Save synchronized data
        run: |
          git config user.name "lottoai-bot"
          git config user.email "actions@github.com"
          git add docs/data/ssq.json docs/data/dlt.json docs/data/sports.json docs/data/sports_predictions.json docs/jobs/data/jobs.json docs/jobs/data/companies.json docs/jobs/data/update-meta.json docs/index.html
          if git diff --cached --quiet; then
            echo "No repository data changes."
          else
            git commit -m "chore: sync jobs, companies, lottery and sports [skip ci]"
            git pull --rebase origin main
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
