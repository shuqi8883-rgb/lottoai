name: Daily graduate jobs refresh
on:
  schedule:
    - cron: '15 1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update public job data
        run: python3 scripts/update_jobs.py
      - name: Commit changed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/jobs/data/jobs.json
          git diff --cached --quiet || git commit -m 'chore: refresh graduate job data'
          git push
