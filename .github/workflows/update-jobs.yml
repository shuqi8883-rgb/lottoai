name: Update Job Radar

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch public jobs
        run: python scripts/update_jobs.py
      - name: Commit updated jobs
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/jobs/data/jobs.json docs/jobs/data/update-meta.json
          git diff --cached --quiet || git commit -m 'chore: daily update job listings'
          git push
